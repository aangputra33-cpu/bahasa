k putih (Sturnus melanopterus) merupakan burung dari suku Sturnidae. Burung ini berukuran sedang, sekitar 20-25 cm. Sesuai namanya, jalak putih memiliki warna bulu seluruhnya putih, kecuali sayap dan ekor berwarna hitam. Suaranya keras dan ribut, terkadang meniru suara burung lainnya. Sebagai burung endemik, sebaran jalak putih hanya ada di Pulau Jawa, terutama Jawa Timur, Madura, Bali, dan Nusa Penida, meskipun terkadang mengembara hingga ke Lombok."], ["p", "Oleh karena keindahannya, jalak putih dinobatkan menjadi fauna identitas di dua kabupaten, yakni Kabupaten Madiun, Jawa Timur, dan Kabupaten Wonogiri, Jawa Tengah. Hal tersebut tentu tidak mengherankan. Sayangnya, keberadaan burung yang dilindungi ini semakin sulit ditemukan di alam liar. International Union for Conservation of Nature and Resources (IUCN) memberikan status critical endangered (sangat terancam punah) pada burung tersebut."], ["p", "Populasi jalak putih yang sekarang sangat memprihatinkan disebabkan oleh tingginya perburuan untuk kepentingan komoditas perdagangan. Selain perburuan untuk perdagangan, berkurangnya habitat menjadi faktor pendukung penurunan populasi jalak putih. Oleh karena itu, perlu dilakukan upaya pelestarian untuk menjaga populasi jalak putih dari kepunahan. Banyak upaya yang dapat dilakukan untuk menjaga kelestarian burung jalak putih. Pemerintah telah memasukkan spesies ini ke dalam daftar burung langka yang dilindungi oleh Pemerintah Indonesia melalui UU No. 5 Tahun 1990 tentang Konservasi Sumber Daya Alam Hayati dan Ekosistemnya serta PP No. 7 Tahun 1999 tentang Pemanfaatan Jenis Tumbuhan dan Satwa Liar. Perlindungan dengan undang-undang ini merupakan salah satu upaya yang bisa dilakukan untuk menekan laju kepunahan jalak putih."], ["p", "Bagi orang yang belum paham tentang kegiatan konservasi burung, mengenal jenis burung dan habitatnya dapat menjadi langkah awal untuk menyebarkan semangat konservasi kepada masyarakat luas. Edukasi bagi masyarakat menjadi bagian penting dalam pelestarian jalak putih. Dengan demikian, upaya perlindungan tidak lagi hanya dilakukan oleh pemerintah atau kalangan pengamat burung saja, tetapi juga melibatkan masyarakat dengan jangkauan yang lebih luas."], ["h", "Cermati pokok-pokok pikiran berikut!"], ["html", "<table class=\"mini\"><tr><th>No.<\/th><th>Pokok Pikiran<\/th><\/tr><tr><td>1.<\/td><td>Pendeskripsian burung jalak putih.<\/td><\/tr><tr><td>2.<\/td><td>Populasi burung jalak putih.<\/td><\/tr><tr><td>3.<\/td><td>....<\/td><\/tr><tr><td>4.<\/td><td>Edukasi kepada masyarakat tentang upaya pelestarian jalak putih.<\/td><\/tr><\/table>"]], "q": "Pokok pikiran yang sesuai untuk melengkapi bagian yang rumpang sesuai isi teks di atas adalah ...", "o": ["Solusi yang ditawarkan penulis untuk mengatasi permasalahan jalak putih.", "Upaya yang telah dilakukan untuk mengatasi masalah jalak putih.", "Upaya pelestarian burung jalak putih dari kepunahan.", "Penjelasan pentingnya upaya pelestarian burung jalak putih.", "Kendala-kendala yang dihadapi dalam pelestarian burung jalak putih."], "a": "C", "e": "Urutan isi teks: paragraf 1 mendeskripsikan jalak putih, paragraf 2-3 membahas populasinya yang menurun, paragraf 3 juga memuat upaya pelestarian dari kepunahan (UU dan daftar satwa dilindungi), dan paragraf 4 membahas edukasi masyarakat. Pokok pikiran nomor 3 yang rumpang adalah upaya pelestarian jalak putih dari kepunahan (C)."}, {"n": 7, "g": null, "ps": [["h", "Cermati kutipan biografi berikut!"], ["p", "Dewi Sartika dilahirkan dari keluarga priayi di daerah Sunda, yaitu pasangan Nyi Raden Rajapermas dengan Raden Somanagara. Dari kecil, Dewi Sartika sudah menunjukkan bakat pendidikan dan kegigihan yang dimilikinya untuk dapat meraih kesuksesan. Sambil bermain di belakang gedung kepatihan, ia sering melakukan kegiatan-kegiatan yang pernah ia dapat di sekolah, yaitu belajar membaca, menulis, dan bahasa Belanda, bersama anak-anak pembantu di kepatihan. Papan bilik kandang kereta, arang, dan pecahan genting dijadikannya sebagai media untuk mereka belajar bersama."], ["p", "Setelah beranjak remaja, jiwanya yang telah tumbuh menjadi dewasa semakin membawa Dewi Sartika untuk dapat mewujudkan cita-citanya. Hal ini didorong pula oleh pamannya, Bupati Martanagara, yang memang mempunyai keinginan yang sama dengan Dewi Sartika. Namun, meski memiliki keinginan yang sama dengan pamannya, tidak menjadikan cita-cita tersebut dapat terwujud dengan mudah. Hal tersebut disebabkan pada saat itu terdapat adat yang mengekang kaum wanita. Hal itulah yang membuat pamannya mengalami kesulitan dan khawatir terhadap Dewi Sartika. Oleh karena kegigihan dan perjuangannya, akhirnya Dewi Sartika bisa mendapatkan izin mendirikan sekolah untuk perempuan."], ["p", "Sejak tahun 1902, Dewi Sartika sudah dapat merintis pendidikan bagi kaum perempuan di sebuah ruangan kecil, tepatnya di belakang rumah ibunya di Bandung. Dewi Sartika mengajar di hadapan beberapa anggota keluarganya yang perempuan. Merenda, memasak, membaca, menulis, dan jahit-menjahit menjadi materi pelajaran pada saat itu."]], "q": "Keteladanan tokoh berdasarkan kutipan tersebut adalah ...", "o": ["Dewi Sartika dilahirkan dari keluarga priayi.", "Dewi Sartika belajar membaca dan menulis bersama anak pembantu.", "Dewi Sartika fasih dan terampil berbahasa Belanda.", "Dewi Sartika gigih merintis pendidikan bagi kaum wanita.", "Dewi Sartika pandai memasak, membaca, dan menulis."], "a": "D", "e": "Keteladanan adalah sifat yang patut dicontoh. Teks menekankan kegigihan Dewi Sartika menghadapi adat yang mengekang hingga akhirnya mendapat izin mendirikan sekolah perempuan dan merintis pendidikan sejak 1902. Pilihan A, B, C, dan E hanya fakta biografis, bukan teladan."}, {"n": 8, "g": [8, 9], "ps": [["h", "Cermati teks berikut untuk menjawab soal nomor 8 dan 9!"], ["p", "(1) Ilmu pengetahuan memang peranan dalam segala hal, termasuk kehidupan berbangsa dan bernegara. (2) Dengan ilmu pengetahuan, sebuah bangsa bisa meraih kedaulatannya, termasuk dalam mengelola sumber daya alam. (3) Jika memiliki ilmu pengetahuan, kita tidak akan mengalami kesulitan dalam mengelola kekayaan alam. (4) Melalui ilmu pengetahuan juga, tenaga kerja dengan keterampilan yang memadai dapat menjadi tuan di tanah airnya sendiri. (5) Kita harus tetap mampu bersaing di tengah serbuan tenaga asing yang datang ke Indonesia dengan tetap berpegang teguh pada nilai-nilai Pancasila."]], "q": "Kalimat utama paragraf tersebut terdapat pada kalimat bernomor ....", "o": ["(1)", "(2)", "(3)", "(4)", "(5)"], "a": "A", "e": "Paragraf bersifat deduktif: gagasan umum diletakkan di awal, lalu dijelaskan dengan kalimat-kalimat penjelas. Kalimat (1) memuat gagasan utama, yaitu ilmu pengetahuan berperan dalam segala hal, termasuk kehidupan berbangsa dan bernegara. Kalimat (2)-(5) merinci peran tersebut."}, {"n": 9, "g": [8, 9], "ps": [["h", "Cermati teks berikut untuk menjawab soal nomor 8 dan 9!"], ["p", "(1) Ilmu pengetahuan memang peranan dalam segala hal, termasuk kehidupan berbangsa dan bernegara. (2) Dengan ilmu pengetahuan, sebuah bangsa bisa meraih kedaulatannya, termasuk dalam mengelola sumber daya alam. (3) Jika memiliki ilmu pengetahuan, kita tidak akan mengalami kesulitan dalam mengelola kekayaan alam. (4) Melalui ilmu pengetahuan juga, tenaga kerja dengan keterampilan yang memadai dapat menjadi tuan di tanah airnya sendiri. (5) Kita harus tetap mampu bersaing di tengah serbuan tenaga asing yang datang ke Indonesia dengan tetap berpegang teguh pada nilai-nilai Pancasila."]], "q": "Pernyataan yang sesuai dengan isi paragraf tersebut ...", "o": ["Ketika masih banyak pengangguran, banyak tenaga asing yang datang untuk menjadi tenaga kerja di Indonesia.", "Generasi muda Indonesia mampu bersaing mempertahankan nilai-nilai luhur Pancasila.", "Bangsa dan negara akan berdaulat dan menjadi bangsa yang maju jika masyarakatnya berpendidikan tinggi.", "Kita harus mengutamakan tenaga kerja dari dalam negeri jika ingin menjadi bangsa yang berdaulat.", "Bangsa Indonesia harus tetap berpegang teguh pada nilai-nilai Pancasila untuk menjadi bangsa yang berdaulat."], "a": "C", "e": "Inti paragraf: dengan ilmu pengetahuan (berpendidikan) suatu bangsa bisa meraih kedaulatan dan kemajuan, termasuk dalam mengelola sumber daya alam dan menjadi tuan di negeri sendiri. Itu sejalan dengan pilihan C. Pilihan A, B, D, dan E menyimpang dari hubungan sebab-akibat yang dikemukakan teks (ilmu pengetahuan sebagai kunci kedaulatan)."}, {"n": 10, "g": null, "ps": [["h", "Cermati teks berikut!"], ["p", "(1) Bunga Rafflesia arnoldii memiliki keunikan dibandingkan bunga yang lain. (2) Bunga ini mempunyai lima helai daun mahkota yang mengelilingi bagian yang terlihat seperti mulut gentong. (3) Di dasar bunga terdapat bagian seperti piringan berduri yang berisi benang sari atau putik, bergantung pada jenis kelamin bunga, jantan atau betina yang mengeluarkan bau busuk. (4) Hewan penyerbuk untuk membantu penyebaran tanaman adalah lalat dan kumbang. (5) Bunga Rafflesia arnoldii hanya berumur sekitar satu minggu (5-7 hari) dan setelah itu, layu atau mati."]], "q": "Kalimat penjelas yang tidak padu terdapat pada nomor ....", "o": ["(1)", "(2)", "(3)", "(4)", "(5)"], "a": "D", "e": "Kalimat utama (1) menyatakan keunikan bunga Rafflesia arnoldii. Kalimat (2), (3), dan (5) menjelaskan keunikan itu (bentuk mahkota, bagian dasar bunga dan baunya, serta umurnya yang pendek). Kalimat (4) tentang hewan penyerbuk untuk penyebaran tanaman tidak menjelaskan keunikan bunga, sehingga tidak padu."}, {"n": 11, "g": null, "ps": [["h", "Cermati kutipan cerpen berikut !"], ["p", "Karena ia tetap diam dan kelihatannya gelisah ketika mendengar bunyi seruling kapal dari arah pelabuhan, maka saya pun memaklumi. Rupanya ia ingin cepat kembali ke kapalnya. Kami sama-sama berdiri dan menjabat tangan perpisahan. Lalu saya tepuk-tepuk bahunya, dan dalam bahasa Inggris saya katakan padanya basa-basi sebagai orang timur, \"Mampirlah ke rumahku.\""], ["p", "\"Loudwing\", kata saya sambil membuang tisu ke lantai, \"bila kapal kamu suatu ketika nanti singgah di Indonesia, jangan lupa mampir ke Jakarta, ya. Di sana nanti kamu akan dapat melihat bahwa negeri kami tidak seperti yang kalian sangka. Di Jakarta nanti kamu akan menemui sebuah tugu yang puncaknya ada emas 30 kilogram. Bahkan, di sana ada juga stadion yang terbesar di Asia Tenggara, ada masjid yang terbesar di Asia Tenggara\". Dia mengangguk sambil tersenyum."], ["s", "(Harga Diri, Muchwardi Muchtar)"]], "q": "Makna simbolik orang timur pada kutipan cerpen tersebut adalah ....", "o": ["orang yang baik", "masyarakat yang sopan", "orang yang memiliki kelebihan", "masyarakat yang rajin berdoa", "masyarakat yang senang berpura-pura"], "a": "B", "e": "Dalam konteks cerpen, \"basa-basi sebagai orang timur\" menggambarkan kebiasaan orang Timur (Indonesia) yang menjamu dan mengundang orang lain dengan ramah dan santun, sehingga orang timur melambangkan masyarakat yang sopan."}, {"n": 12, "g": null, "ps": [], "q": "Maksud kumpulan kata basa-basi sebagai orang timur pada kutipan cerpen tersebut adalah ...", "o": ["Orang timur suka sekali berbasa-basi.", "Orang Asia yang suka berbasa-basi.", "Orang dari bagian timur yang suka sekali berbasa-basi.", "Orang Asia Tenggara yang suka mengobrol.", "Keramahan orang yang berasal dari Asia."], "a": "E", "e": "Tokoh \"saya\" (orang Indonesia/Asia) mengundang Loudwing mampir ke rumahnya sebagai ungkapan keramahan khas orang Asia (timur). Basa-basi di sini berarti sikap ramah dan sopan santun, bukan sekadar suka berbicara tanpa makna, sehingga E paling tepat."}, {"n": 13, "g": [13, 14], "ps": [["h", "Cermati kutipan berikut untuk menjawab soal nomor 13 dan 14!"], ["p", "(1) Sungguh aku kasihan pada lelaki, betapa besar beban yang harus ditanggungnya bahkan sejak ia masih berada dalam kandungan. (2) Begitu mengetahui anak mereka laki-laki lewat kecanggihan teknologi, orang tua sibuk menggantungkan impian dan harapan setinggi langit untuk si anak. (3) \"Anak kita laki-laki, dia pasti bisa jadi dokter ahli bedah yang hebat dewasa nanti,\" ucap si ayah. (4) \"Anak kita laki-laki, lebih baik ia jadi pengacara atau hakim saja, supaya dia bisa membela hak-hak kaum tertindas,\" Ibunya tak mau kalah. (5) \"Kalau begitu, lebih baik dia jadi polisi atau tentara saja, lebih gagah rasanya, daripada jadi hakim yang kerjanya cuma duduk dan memukul palu. (6) Atau atlet? Dia bisa jadi atlet yang hebat dan menjadi kebanggaan negara saat ia main di Olimpiade Internasional.\""]], "q": "Kalimat bermajas dalam kutipan tersebut terdapat pada nomor ....", "o": ["(1)", "(2)", "(3)", "(4)", "(5)"], "a": "B", "e": "Kalimat (2) mengandung majas hiperbola: \"menggantungkan impian dan harapan setinggi langit\" melebih-lebihkan besarnya harapan orang tua. Kalimat lain bermakna lugas."}, {"n": 14, "g": [13, 14], "ps": [["h", "Cermati kutipan berikut untuk menjawab soal nomor 13 dan 14!"], ["p", "(1) Sungguh aku kasihan pada lelaki, betapa besar beban yang harus ditanggungnya bahkan sejak ia masih berada dalam kandungan. (2) Begitu mengetahui anak mereka laki-laki lewat kecanggihan teknologi, orang tua sibuk menggantungkan impian dan harapan setinggi langit untuk si anak. (3) \"Anak kita laki-laki, dia pasti bisa jadi dokter ahli bedah yang hebat dewasa nanti,\" ucap si ayah. (4) \"Anak kita laki-laki, lebih baik ia jadi pengacara atau hakim saja, supaya dia bisa membela hak-hak kaum tertindas,\" Ibunya tak mau kalah. (5) \"Kalau begitu, lebih baik dia jadi polisi atau tentara saja, lebih gagah rasanya, daripada jadi hakim yang kerjanya cuma duduk dan memukul palu. (6) Atau atlet? Dia bisa jadi atlet yang hebat dan menjadi kebanggaan negara saat ia main di Olimpiade Internasional.\""]], "q": "Nilai budaya yang terdapat dalam kutipan tersebut adalah ...", "o": ["Profesi seseorang dapat menentukan derajatnya dalam kehidupan di masyarakat.", "Orang tua selalu mengharapkan kelahiran seorang anak laki-laki.", "Orang tua bersemangat menjadikan anaknya tumbuh dewasa.", "Membela kaum tertindas merupakan pekerjaan pengacara.", "Seorang laki-laki sangat cocok untuk menjadi atlet nasional."], "a": "A", "e": "Orang tua dalam kutipan menyebut profesi bergengsi (dokter ahli bedah, pengacara, hakim, polisi, tentara, atlet) sebagai harapan bagi anaknya. Hal ini mencerminkan nilai budaya bahwa profesi menentukan derajat atau status seseorang di masyarakat."}, {"n": 15, "g": null, "ps": [["h", "Cermati paragraf berikut!"], ["p", "(1) Jiwa kepahlawanan harus senantiasa ditanamkan dan dikembangkan dalam diri generasi muda. (2) Melalui jiwa kepahlawanan, pembangunan di suatu negara dapat berjalan sukses. (3) Jiwa kepahlawanan akan berkembang menjadi nilai-nilai dan sifat kepribadian yang luhur, berjiwa besar, bertanggung jawab, berdedikasi, loyal, dan tangguh. (4) Jiwa kepahlawanan dapat menumbuhkan kepekaan sosial, cinta terhadap sesama, bahkan dapat mengonstruksi daya pikir seseorang. (5) Sifat-sifat ini telah terbukti dimiliki oleh para patriot perjuangan dalam meraih kemerdekaan."]], "q": "Kalimat fakta pada paragraf tersebut ditunjukkan pada nomor ....", "o": ["(1)", "(2)", "(3)", "(4)", "(5)"], "a": "E", "e": "Kalimat fakta memuat peristiwa/kenyataan yang dapat dibuktikan. Kalimat (5) menyatakan sifat-sifat itu telah terbukti dimiliki para patriot perjuangan, yaitu fakta sejarah. Kalimat (1)-(4) berupa saran, harapan, atau pendapat (opini)."}, {"n": 16, "g": [16, 17], "ps": [["h", "Cermati kutipan novel berikut untuk menjawab soal nomor 16 dan 17!"], ["p", "Saat mengambil buku di lemari pakaian, ia tidak sengaja melihat sepucuk surat yang sengaja ia sembunyikan di tumpukan terbawah baju. Itulah benda yang ia bawa saat pergi dari Parepare selain pakaian yang dikenakan. Sepucuk surat yang jadi muasal seluruh masalah. Ia menatap surat itu. Ia benci sekali kenapa tangannya refleks mengambil surat itu. Ia benci sekali kenapa ia tidak kuasa menghentikannya, tangannya malah membuka lipatan kertas itu. Apa yang ia harapkan? Lancang sekali mata dan tangannya. Ia kira kali ini ia lebih tangguh saat membacanya kembali? Atau ia malah berharap isi surat itu telah berubah jadi sebaliknya? Omong kosong! Semua kesibukan ini, pengalaman baru, tidak pernah mampu mengusir pergi kenangan itu. Jika itu sebuah benteng maka benteng itu rapuh, rontok seketika. Jika itu sebuah tameng, maka tameng itu juga tipis dan ringkih, hancur seketika. Lihatlah ia justru lumat lagi seluruh isi surat itu. Menghujam dalam hatinya seperti sakit sekali. Sama seperti yang ia rasakan saat pertama kali membacanya hanya bisa menatap kosong."], ["s", "(Rindu, Tere Liye)"]], "q": "Konflik yang dihadapi tokoh pada kutipan novel tersebut adalah ...", "o": ["Tokoh tidak mampu menyembunyikan rahasia hatinya.", "Keinginan tokoh untuk membaca surat berkali-kali.", "Tidak ada pakaian yang dimiliki oleh tokoh saat ini.", "Tokoh benci terhadap orang yang lancang terhadap dirinya.", "Tokoh tidak mampu mengusir kenangan yang menyakitkan."], "a": "E", "e": "Tokoh bergulat dengan batinnya sendiri: ia berusaha melupakan isi surat, tetapi tetap membukanya dan merasa sakit. Kutipan menegaskan bahwa kesibukan dan pengalaman baru tidak mampu mengusir pergi kenangan itu. Jadi konflik batinnya adalah ketidakmampuan mengusir kenangan menyakitkan."}, {"n": 17, "g": [16, 17], "ps": [["h", "Cermati kutipan novel berikut untuk menjawab soal nomor 16 dan 17!"], ["p", "Saat mengambil buku di lemari pakaian, ia tidak sengaja melihat sepucuk surat yang sengaja ia sembunyikan di tumpukan terbawah baju. Itulah benda yang ia bawa saat pergi dari Parepare selain pakaian yang dikenakan. Sepucuk surat yang jadi muasal seluruh masalah. Ia menatap surat itu. Ia benci sekali kenapa tangannya refleks mengambil surat itu. Ia benci sekali kenapa ia tidak kuasa menghentikannya, tangannya malah membuka lipatan kertas itu. Apa yang ia harapkan? Lancang sekali mata dan tangannya. Ia kira kali ini ia lebih tangguh saat membacanya kembali? Atau ia malah berharap isi surat itu telah berubah jadi sebaliknya? Omong kosong! Semua kesibukan ini, pengalaman baru, tidak pernah mampu mengusir pergi kenangan itu. Jika itu sebuah benteng maka benteng itu rapuh, rontok seketika. Jika itu sebuah tameng, maka tameng itu juga tipis dan ringkih, hancur seketika. Lihatlah ia justru lumat lagi seluruh isi surat itu. Menghujam dalam hatinya seperti sakit sekali. Sama seperti yang ia rasakan saat pertama kali membacanya hanya bisa menatap kosong."], ["s", "(Rindu, Tere Liye)"]], "q": "Keterkaitan isi kutipan novel tersebut dengan kehidupan sehari-hari adalah ...", "o": ["Merapikan buku berdekatan dengan tumpukan baju.", "Merasakan sakit hati saat kita membaca surat.", "Ketidakmampuan melupakan hal buruk dalam kehidupan.", "Melupakan masalah dengan bekerja di tempat lain.", "Pengalaman baru akan menghapus kenangan lama."], "a": "C", "e": "Banyak orang dalam kehidupan nyata sulit melupakan kenangan buruk meskipun sudah berusaha menyibukkan diri, sama seperti tokoh dalam kutipan. Pilihan D dan E bertentangan dengan isi kutipan (kesibukan dan pengalaman baru tidak berhasil menghapus kenangan)."}, {"n": 18, "g": [18, 19], "ps": [["h", "Cermati kutipan novel berikut untuk menjawab soal nomor 18 dan 19!"], ["p", "(1) Sambil makan malam di dapur umum, aku diskusikan kecemasanku kepada Sahibul menara. (2) Kecuali Raja, tampaknya kami semua merasakan hal yang sama. (3) Kami meringis tegang membayangkan ujian maraton sebulan penuh. (4) Atang mencoba menghibur menyemangati dirinya sendiri dan kami semua. (5) Seperti kata Kiai Rais, \"Mari kita kerahkan semua kemampuan kita.\" Setelah itu kita bertawakal.\" (6) \"Kita perbanyak juga ibadah karena ilmu yang sedang kita pelajari itu kan nur. Cahaya. (7) Dan nur hanya bisa ada di tempat yang bersih dan terang,\" timpal Dulmajid."], ["s", "(Negeri 5 Menara, A. Fuadi)"]], "q": "Bukti nilai moral saling memberi semangat, berusaha, dan berdoa dalam kutipan novel tersebut terdapat pada kalimat bernomor ....", "o": ["(1) dan (3)", "(2) dan (6)", "(3) dan (6)", "(4) dan (5)", "(6) dan (7)"], "a": "D", "e": "Saling memberi semangat tampak pada kalimat (4): Atang menyemangati dirinya dan teman-temannya. Berusaha dan berdoa tampak pada kalimat (5): mengerahkan semua kemampuan (berusaha) lalu bertawakal (berserah diri/berdoa). Jadi kalimat (4) dan (5)."}, {"n": 19, "g": [18, 19], "ps": [["h", "Cermati kutipan novel berikut untuk menjawab soal nomor 18 dan 19!"], ["p", "(1) Sambil makan malam di dapur umum, aku diskusikan kecemasanku kepada Sahibul menara. (2) Kecuali Raja, tampaknya kami semua merasakan hal yang sama. (3) Kami meringis tegang membayangkan ujian maraton sebulan penuh. (4) Atang mencoba menghibur menyemangati dirinya sendiri dan kami semua. (5) Seperti kata Kiai Rais, \"Mari kita kerahkan semua kemampuan kita.\" Setelah itu kita bertawakal.\" (6) \"Kita perbanyak juga ibadah karena ilmu yang sedang kita pelajari itu kan nur. Cahaya. (7) Dan nur hanya bisa ada di tempat yang bersih dan terang,\" timpal Dulmajid."], ["s", "(Negeri 5 Menara, A. Fuadi)"]], "q": "Bukti latar suasana kecemasan dalam kutipan novel tersebut terdapat pada kalimat bernomor ....", "o": ["(1) dan (2)", "(1) dan (3)", "(2) dan (4)", "(3) dan (6)", "(6) dan (7)"], "a": "B", "e": "Kalimat (1) menyebut langsung \"kecemasanku\", dan kalimat (3) menggambarkan suasana tegang (\"meringis tegang membayangkan ujian maraton\"). Keduanya menunjukkan latar suasana cemas."}, {"n": 20, "g": null, "ps": [["h", "Cermati paragraf berikut!"], ["p", "Ciri-ciri orang yang bertanggung jawab adalah amanah. Apabila ia dipercaya untuk menjaga suatu informasi, ia akan menjaganya agar pihak lain tidak mengetahuinya. Apabila perlu, dia akan ... agar informasi tersebut tidak menyebar pada pihak lain. Orang seperti ini merupakan orang yang akan disenangi oleh pihak lain karena dapat dipercaya."]], "q": "Ungkapan yang tepat untuk melengkapi bagian rumpang dalam paragraf tersebut adalah ....", "o": ["cuci mulut", "asah mulut", "mulut tajam", "tutup mulut", "main mulut"], "a": "D", "e": "Konteks kalimat: menjaga informasi agar tidak menyebar. Ungkapan yang bermakna \"tidak membocorkan/merahasiakan\" adalah tutup mulut."}, {"n": 21, "g": null, "ps": [["h", "Cermati paragraf berikut!"], ["p", "Penggunaan merkuri pada aktivitas pertambangan emas ilegal di Kecamatan Klueng Tengah, Aceh Selatan mengancam kehidupan warga dan kelestarian lingkungan. <em class=\"hl\">Merkuri sisa pengolahan emas dibuang-buang secara sembarangan sehingga mengancam daripada sumber air dan kesehatan manusia.<\/em> Pengetahuan penambang terhadap bahaya merkuri rendah. Tidak ada sosialisasi kepada penambang. Mereka tidak tahu bahwa merkuri berbahaya bagi kesehatan manusia dan dapat menyebabkan hal yang buruk."]], "q": "Perbaikan kalimat yang dicetak miring agar menjadi efektif adalah ...", "o": ["Merkuri sisa pengolahan emas dibuang secara sembarangan sehingga mengancam sumber air dan kesehatan manusia.", "Merkuri sisa pengolahan emas dibuang-buang sehingga mengancam sumber air dan kesehatan manusia.", "Merkuri yang dibuang-buang secara sembarangan sehingga mengancam daripada sumber air dan kesehatan manusia.", "Merkuri sisa pengolahan emas yang dibuang sembarangan sehingga mengancam daripada sumber air dan kesehatan manusia.", "Sisa pengolahan emas yang dibuang-buang secara sembarangan akan mengancam sumber air dan kesehatan manusia."], "a": "A", "e": "Kalimat asli tidak efektif karena (1) \"dibuang-buang\" bermakna menyia-nyiakan sehingga berlebihan jika disandingkan dengan \"secara sembarangan\", dan (2) kata \"daripada\" tidak diperlukan. Pilihan A menghilangkan kedua pemborosan itu dan tetap memiliki subjek dan predikat yang lengkap (C dan D tidak berpredikat sebagai kalimat, E menghilangkan kata \"merkuri\")."}, {"n": 22, "g": null, "ps": [["h", "Cermati kalimat-kalimat berikut!"], ["p", "(1) Ini merupakan tingkat degradasi yang sangat memprihatinkan."], ["p", "(2) Perubahan ekologi dan orientasi ekonomi membawa ancaman primer dan sekunder bagi hewan endemik Papua ini."], ["p", "(3) Burung cenderawasih yang menjadi ikon Papua di ambang kritis."], ["p", "(4) Ancaman primer berupa kerusakan habitat."], ["p", "(5) Hasil penelitian pada Maret 2012 yang dilakukan BKSDA Papua diketahui setiap satu kilometer persegi hanya ditemukan 2-3 ekor cenderawasih."], ["p", "(6) Adapun ancaman sekunder berupa perburuan dan perdagangan secara besar-besaran dan terselubung."], ["p", "(7) Padahal, tahun 2000-2005 masih ditemukan 10-15 ekor."]], "q": "Urutan kalimat-kalimat yang tepat agar menjadi paragraf laporan yang padu adalah ....", "o": ["(1), (3), (2), (4), (6), (5), dan (7)", "(1), (2), (4), (5), (6), (7), dan (3)", "(2), (3), (1), (5), (7), (4), dan (6)", "(3), (2), (1), (6), (4), (5), dan (7)", "(3), (2), (4), (6), (5), (7), dan (1)"], "a": "E", "e": "Alur yang logis: (3) memperkenalkan objek (cenderawasih ikon Papua di ambang kritis); (2) menyebut ancaman primer dan sekunder; (4) menjelaskan ancaman primer; (6) menjelaskan ancaman sekunder (diawali \"Adapun\"); (5) menyajikan data penelitian 2012; (7) membandingkan dengan data 2000-2005 (diawali \"Padahal\"); (1) menutup dengan penilaian \"Ini merupakan tingkat degradasi yang sangat memprihatinkan\", dengan \"Ini\" merujuk pada penurunan populasi tersebut. Urutan itu terdapat pada pilihan E."}, {"n": 23, "g": null, "ps": [["h", "Cermati paragraf narasi berikut!"], ["p", "Saya jatuh cinta pada puisi gara-gara suatu malam sebelum tidur, membaca seuntai kata dalam sebuah sajak Sapardi Djoko Damono: \"Masih terdengar sampai di sini duka-Mu abadi\". Waktu itu saya masih duduk di kelas dua SMA dan belum punya cita-cita. Kata-kata itu terus menggema dalam kepala saya dan membuat saya semakin suka bersendiri bersama puisi. [....] Akan tetapi, menurut teman saya, lebih baik saya jadi teman penyair saja daripada menjadi penyair. Dan saya pun mengiyakan."]], "q": "Kalimat yang tepat untuk melengkapi paragraf tersebut agar membentuk cerita yang padu adalah ...", "o": ["Sempat terbesit keinginan saya untuk ikut-ikutan menjadi penyair.", "Saya pun mengikuti kegiatan penulisan puisi dan pembacaan puisi.", "Saya menghubungi Sapardi Djoko Damono untuk mendalami puisi.", "Keluarga dan teman saya pun banyak yang mendukung cita-cita itu.", "Dengan puisi, saya menjadi lebih percaya diri mengungkapkan ide."], "a": "A", "e": "Kalimat sesudah bagian rumpang berbunyi \"Akan tetapi, menurut teman saya, lebih baik saya jadi teman penyair saja daripada menjadi penyair.\" Kalimat itu menunjukkan pertentangan terhadap keinginan menjadi penyair, sehingga kalimat rumpang harus memuat keinginan tersebut (A)."}, {"n": 24, "g": null, "ps": [["h", "Cermati teks berikut!"], ["p", "Prosedur membuat Surat Keterangan Catatan Kepolisian (SKCK) secara online:"], ["p", "(1) Siapkan duplikat dokumen yang diperoleh melalui hasil scan, meliputi fotokopi KTP, SIM, KK, akta kelahiran, foto, dan berkas-berkas yang diperlukan."], ["p", "(2) Akseslah website resmi Polres yang sesuai dengan lokasi domisili."], ["p", "(3) Isilah formulir pendaftaran."], ["p", "(4) [....]"], ["p", "(5) Catatlah nomor registrasi yang Anda peroleh pada unggahan tersebut."], ["p", "(6) Setelah tiga hari, datanglah ke kantor Polsek/Polres untuk mengambil SKCK dengan menunjukkan nomor registrasi."]], "q": "Kalimat yang tepat untuk melengkapi prosedur tersebut adalah ...", "o": ["Unggah berkas-berkas yang telah Anda scan.", "Isikan nomor pendaftaran sesuai dengan data.", "Lampirkan data-data Anda ketika mengambil SKCK.", "Simpan berkas-berkas tersebut di map warna merah.", "Lakukan tes kesehatan di pusat layanan masyarakat."], "a": "A", "e": "Langkah (5) menyebut \"nomor registrasi yang Anda peroleh pada unggahan tersebut\". Maka langkah (4) harus berupa kegiatan mengunggah, yaitu mengunggah berkas hasil pindai (scan) yang disiapkan pada langkah (1)."}, {"n": 25, "g": null, "ps": [["h", "Cermati paragraf berikut!"], ["p", "Gadget adalah sebuah istilah dalam bahasa Inggris yang berarti perangkat elektronik kecil yang memiliki fungsi khusus. Sekarang gadget tidak hanya diartikan sebagai benda elektronik, ... sudah berkembang artinya dalam bentuk software. Dalam perkembangan berikutnya, manfaat gadget pun makin beragam. Pengguna gadget juga makin meluas tidak hanya kalangan muda dan dewasa, ... usia balita sudah dapat mengoperasikannya, ... sekadar bermain games atau menonton video."]], "q": "Konjungsi yang tepat untuk melengkapi paragraf tersebut adalah ....", "o": ["bahkan, tetapi, karena", "tetapi, bahkan, meskipun", "disebabkan, padahal, meskipun", "di samping itu, sehingga, bahkan", "akan tetapi, sehingga, sebaliknya"], "a": "B", "e": "(1) \"tidak hanya ... benda elektronik, tetapi sudah berkembang ...\" memakai konjungsi pertentangan \"tetapi\". (2) \"tidak hanya kalangan muda dan dewasa, bahkan usia balita ...\" memakai konjungsi penegas \"bahkan\". (3) \"..., meskipun sekadar bermain games\" memakai konjungsi konsesif \"meskipun\"."}, {"n": 26, "g": null, "ps": [["h", "Cermati paragraf berikut!"], ["p", "Lompat batu (hombo batu) merupakan tradisi yang sangat populer pada masyarakat Nias di Kabupaten Nias Selatan. Tradisi ini telah dilakukan sejak lama dan ... secara turun-temurun oleh masyarakat di Desa Bawo Mataluo (Bukit Matahari). Tradisi lompat batu sudah dilakukan sejak zaman para leluhur. Pada zaman dahulu, sering terjadi peperangan antarsuku sehingga mereka ... diri agar kuat dan mampu menembus benteng lawan yang konon cukup tinggi untuk .... Seiring dengan perkembangan zaman, tradisi ini turut berubah fungsinya. Tradisi lompat batu digunakan bukan untuk perang lagi, melainkan untuk ritual dan juga sebagai simbol budaya masyarakat Nias."]], "q": "Kata berimbuhan yang tepat untuk melengkapi paragraf tersebut adalah ....", "o": ["mewariskan, dilatih, melompat", "diwariskan, melatih, dilompati", "diwarisi, melatih, melompati", "diwariskan, dilatih, dilompati", "mewarisi, melatih, dilompati"], "a": "B", "e": "(1) Tradisi dilakukan dan \"diwariskan\" (bentuk pasif karena tradisi adalah objek). (2) \"mereka melatih diri\" (bentuk aktif karena subjek \"mereka\" melakukan pekerjaan; \"dilatih diri\" tidak lazim). (3) \"benteng ... cukup tinggi untuk dilompati\" (benteng sebagai sasaran lompatan, pasif dengan akhiran -i)."}, {"n": 27, "g": null, "ps": [["h", "Cermati paragraf berikut!"], ["p", "Industri kreatif dalam Industri Kecil Menengah (IKM) memiliki peranan strategis. Hal ini dikarenakan industri kreatif mampu memberikan sumbangan yang cukup besar bagi perekonomian nasional. Pada tahun 2015, industri fesyen merupakan industri yang memberikan kontribusi besar dari keseluruhan ekspor ... ekonomi kreatif. Industri kreatif fesyen menyumbang 56,27 persen dari keseluruhan ekspor industri kreatif. Di sisi lain, industri kreatif di bidang kuliner masih minim dalam menyumbang kontribusi ekspor. Padahal, kuliner merupakan industri kreatif yang mendominasi hampir di seluruh wilayah Indonesia. Hal ini perlu menjadi pertimbangan para ... di bidang industri kreatif untuk memasarkan kuliner Indonesia di pasar dunia."]], "q": "Istilah yang tepat untuk melengkapi paragraf tersebut adalah ....", "o": ["komoditas, importir", "produk, ekspor", "komoditas, eksportir", "produksi, eksportir", "produksi, importir"], "a": "C", "e": "(1) \"keseluruhan ekspor komoditas ekonomi kreatif\": komoditas ialah barang dagangan utama yang diekspor. (2) \"pertimbangan para eksportir di bidang industri kreatif untuk memasarkan kuliner Indonesia di pasar dunia\": pelaku yang menjual ke luar negeri adalah eksportir, bukan importir (pembeli dari luar negeri)."}, {"n": 28, "g": null, "ps": [["h", "Cermati paragraf berikut!"], ["p", "Berdasarkan data tahun 1999, luas wilayah mangrove yang terdapat di Indonesia sekitar 8,6 juta hektare. Namun, sejak rentang 1999 hingga 2005, sudah berkurang sebanyak 5,58 juta hektare atau sekitar 64 persennya. Saat ini hutan mangrove di Indonesia yang dalam keadaan baik tersisa 3,6 juta hektare, selebihnya dalam keadaan rusak ringan dan sedang. Faktor yang memengaruhi menurunnya jumlah luasan mangrove adalah pembukaan lahan (deforestasi) di daerah pesisir yang mengakibatkan sejumlah persoalan, salah satunya abrasi. Dampak hilangnya mangrove pun mulai dirasakan oleh masyarakat daerah pesisir. Berkurangnya hutan mangrove di daerah pesisir memengaruhi jumlah tangkapan ikan, kepiting, dan kerang. [....]"]], "q": "Kalimat simpulan yang tepat untuk melengkapi paragraf tersebut adalah ...", "o": ["Dengan demikian, diperlukan kerja sama pemerintah dan masyarakat untuk menjaga mangrove.", "Dengan demikian, hutan mangrove memiliki nilai ekologis dan ekonomis bagi masyarakat.", "Jadi, pendapatan masyarakat pesisir berkurang karena hilangnya mangrove di daerah tersebut.", "Oleh sebab itu, keberadaan mangrove perlu dilestarikan dan jumlah luasan mangrove perlu dikembangkan.", "Sehingga masyarakat pesisir perlu melakukan penanaman kembali kawasan mangrove yang rusak."], "a": "D", "e": "Paragraf memaparkan penurunan luas mangrove, penyebabnya, dan dampaknya bagi masyarakat. Simpulan yang tepat adalah akibat logis dari uraian tersebut, yaitu perlunya melestarikan dan mengembangkan luasan mangrove, dengan penanda simpulan \"Oleh sebab itu\". Pilihan C hanya mengulang dampak, E dimulai dengan \"Sehingga\" (tidak baku sebagai awal kalimat), dan A serta B memuat gagasan yang tidak ditarik langsung dari isi paragraf."}, {"n": 29, "g": null, "ps": [["h", "Cermati kutipan novel berikut!"], ["p", "Pak Jaman dihormati oleh warga di kampung. Mereka menganggapnya sebagai seorang pahlawan karena telah berani ikut mengangkat senjata melawan Belanda. Warga kampung juga mengetahui bahwa Pak Jaman seorang yang saleh dan beragama."], ["p", "Tak cukup itu saja, Pak Jaman tak segan-segan membantu para tetangganya yang mengalami kesulitan. Sering didapati ia memberikan bantuan dalam bentuk barang, uang, ataupun tenaga, ketika tetangganya kesulitan dan membutuhkan bantuan. Wajar kalau kemudian semua warga kampung menyukai dan menghormati beliau dengan perangainya yang baik."]], "q": "Ringkasan yang tepat sesuai kutipan novel tersebut adalah ...", "o": ["Pak Jaman yang dihormati orang di kampung termasuk orang-orang Belanda sehingga ia layak dijadikan pahlawan. Beliau juga selalu membantu para tetangga yang membutuhkan bantuannya, baik dalam bentuk barang, uang, ataupun tenaga.", "Pak Jaman dihormati orang Belanda karena ia orang saleh sehingga dia dianggap sebagai pahlawan di kampungnya. Di samping itu, beliau juga tidak segan untuk selalu membantu tetangganya yang mengalami kesulitan.", "Pak Jaman orang yang saleh dan beragama, beliau juga berani angkat senjata ketika melawan Belanda sehingga ia dihormati dan dianggap sebagai pahlawan di kampungnya. Beliau juga disukai karena berperangai baik dan suka membantu orang yang membutuhkannya.", "Seorang yang saleh dan beragama, pasti disukai banyak orang. Beliau layak digelari pahlawan karena ikut mengangkat senjata ketika perang melawan Belanda serta membela orang yang miskin di kampungnya.", "Sosok pahlawan yang berani mengangkat senjata melawan Belanda adalah Pak Jaman. Dia juga dipandang orang saleh karena beragama dan berperangai baik, serta suka membantu orang yang membutuhkan pertolongannya."], "a": "C", "e": "Ringkasan harus memuat gagasan pokok secara benar dan lengkap: Pak Jaman dihormati karena berani melawan Belanda (pahlawan), saleh dan beragama, serta suka membantu tetangga sehingga disukai warga. Pilihan C memenuhi semuanya. Pilihan A dan B salah (yang menghormati adalah warga kampung, bukan orang Belanda), D menambahkan hal yang tidak ada (membela orang miskin), dan E mengubah hubungan sebab-akibat (saleh karena berperangai baik)."}, {"n": 30, "g": null, "ps": [["h", "Cermati teks negosiasi berikut!"], ["p", "Afip : \"Maaf Bu, saya tidak sependapat dengan Ibu jika pada hari Buruh kami tetap masuk seperti biasa!\""], ["p", "Alvira : \"Mengapa tidak setuju? Sejauh ini, konsep kita adalah hari Buruh bukan berarti harus meliburkan pekerja. Bahkan, dengan diperingatinya hari Buruh, kita harus semakin menunjukkan etos kerja.\""], ["p", "Afip : \"Bagaimana jika hari Buruh tetap masuk, tetapi diisi kegiatan hiburan yang merekatkan tali silaturahmi antara buruh dan perusahaan? Dengan demikian, terjalin erat antara keduanya dan pada akhirnya etos kerja buruh juga meningkat.\""], ["p", "Alvira : \"Memangnya rencana Pak Afip dan teman-teman mau mengadakan acara seperti apa?\""], ["p", "Afip : \"Kami akan mengadakan hiburan dan kegiatan sosial donor darah yang diadakan di lingkungan perusahaan kita selepas jam kerja atau di sela-sela jam istirahat.\""], ["p", "Alvira : \"Oh, kalau begitu saya sangat setuju dan pasti perusahaan sangat mendukung rencana itu.\""], ["p", "Afip : \"Terima kasih, Bu. Mudah-mudahan kegiatan yang kami gagas ini dapat berjalan lancar sesuai rencana.\""]], "q": "Parafrasa yang sesuai dengan isi teks negosiasi tersebut adalah ...", "o": ["Pak Afip memprotes kebijakan perusahaan yang dianggapnya semena-mena terhadap para buruh dengan alasan perayaan hari Buruh akan melemahkan produktivitas dan etos kerja buruh dalam mencapai target perusahaan.", "Bu Alvira keberatan dengan kebijakan perusahaan yang melarang libur pada saat perayaan hari Buruh, tetapi kemudian disepakati, tanpa harus libur para buruh dapat merayakannya di sela waktu istirahat dan selepas jam kerja.", "Pak Afip keberatan dengan kebijakan perusahaan yang melarang buruh libur pada saat perayaan hari Buruh, tetapi kemudian disepakati, tanpa harus libur para buruh dapat merayakan hari Buruh di sela jam istirahat dan selepas kerja dengan kegiatan bermanfaat.", "Bu Alvira melarang perayaan hari Buruh yang setiap tahun dirayakan pada tanggal 1 Mei dengan alasan bahwa perayaan tersebut tidak bermanfaat dan hanya menurunkan etos kerja para buruh dalam mencapai target yang telah disepakati.", "Para buruh bersikukuh merayakan hari Buruh dengan mengadakan kegiatan silaturahmi dan kegiatan sosial yang pada akhirnya akan mempererat dan memperkokoh persatuan antarburuh yang bermuara pada meningkatnya etos kerja."], "a": "C", "e": "Yang keberatan pada awal dialog adalah Pak Afip (buruh/perwakilan) terhadap kebijakan perusahaan (diwakili Bu Alvira) yang tetap mewajibkan masuk pada hari Buruh. Kemudian Afip mengusulkan kegiatan hiburan dan donor darah di sela jam istirahat atau selepas jam kerja, dan Alvira menyetujuinya. Pilihan C sesuai dengan alur tersebut. Pilihan B keliru menyebut Alvira yang keberatan."}, {"n": 31, "g": null, "ps": [["h", "Cermati kalimat-kalimat berikut!"], ["p", "Kalimat pendapat: Tenaga kerja asing yang akan bekerja atau tinggal di Indonesia harus mengikuti tes UKBI (Uji Kemahiran Berbahasa Indonesia)."], ["p", "Kalimat argumen:"], ["p", "(1) Sebagai wujud proteksi terhadap bahasa Indonesia."], ["p", "(2) Sebagai tolak ukur kemampuan dalam bekerja."], ["p", "(3) Sebagai proses adaptasi WNA ketika berada di masyarakat."], ["p", "(4) Sebagai cerminan kualitas kerja tenaga kerja asing."], ["p", "(5) Sebagai upaya seleksi penerimaan tenaga kerja asing."]], "q": "Argumen yang mendukung kalimat pendapat tersebut terdapat pada kalimat bernomor ....", "o": ["(1), (2), dan (3)", "(1), (3), dan (5)", "(2), (3), dan (4)", "(2), (4), dan (5)", "(3), (4), dan (5)"], "a": "B", "e": "UKBI mengukur kemahiran berbahasa Indonesia, bukan kemampuan atau kualitas kerja. Argumen yang relevan: (1) melindungi bahasa Indonesia, (3) membantu WNA beradaptasi dengan masyarakat melalui bahasa, dan (5) menjadi alat seleksi penerimaan tenaga kerja asing. Argumen (2) dan (4) tidak berhubungan langsung dengan tes bahasa."}, {"n": 32, "g": null, "ps": [["h", "Cermati teks prosedur berikut!"], ["p", "Prosedur Memperpanjang SIM"], ["p", "Sebagaimana proses perpanjangan SIM di kantor Samsat, layanan SIM keliling juga menerapkan sejumlah proses yang wajib dilalui oleh peserta yang akan melakukan perpanjangan SIM mereka di sana. Berikut ini adalah cara melakukan perpanjangan SIM di layanan SIM keliling. Datangi mobil khusus layanan SIM keliling terdekat. <em class=\"hl\">Mengisikanlah formulir permohonan dengan data diri yang lengkap dan benar.<\/em> Lengkapi formulir tersebut dengan melampirkan data pendukung yang dibutuhkan, antara lain: SIM lama, fotokopi SIM, dan KTP. Tunggu giliran untuk melakukan proses selanjutnya. Setelah dipanggil oleh petugas, akan dilakukan penyamaan data diri dengan data pada formulir yang telah diisi, pemindaian sidik jari dan juga tanda tangan. Tunggulah pencetakan SIM. Setelah selesai, bayarlah biaya perpanjangan SIM kepada petugas."]], "q": "Perbaikan kalimat yang bercetak miring pada teks prosedur tersebut adalah ...", "o": ["Formulir pendaftaran mengisi dengan data diri yang lengkap dan benar.", "Isikan formulir pendaftaran dengan data diri yang lengkap dan benar.", "Formulir pendaftara dan data diri diisi dengan lengkap dan benar.", "Mengisikan formulir pendaftaran dan data diri dengan lengkap dan benar.", "Isilah formulir pendaftaran dengan data diri secara lengkap dan benar."], "a": "E", "e": "Kalimat prosedur berupa kalimat perintah. Verba yang tepat adalah \"isilah\" (mengisi lokasi/wadah: formulir), sedangkan \"isikan\" dipakai untuk benda yang dimasukkan (data). Kalimat asli salah karena memakai \"Mengisikanlah\" yang tidak berbentuk imperatif. Maka perbaikan yang benar adalah \"Isilah formulir pendaftaran dengan data diri secara lengkap dan benar.\" (E)."}, {"n": 33, "g": null, "ps": [["h", "Cermati teks berikut!"], ["p", "(1) Ledakan populasi alga adalah keberadaan sejumlah besar alga yang mengapung di permukaan air laut. (2) Ledakan populasi alga terjadi secara alami pada Perairan Laut yang mengandung nutrisi tinggi. (3) Salah satu penyebab tingginya nutrisi di perairan laut adalah dari limpasan pupuk untuk tanah pertanian dan limbah peternakan. (4) Contoh ledakan populasi alga merah terjadi di Teluk Meksiko. (5) Ledakan alga ini mempunyai dampak buruk bagi keberlangsungan kehidupan ikan di Laut. (6) Ikan-ikan di Perairan Laut dapat mengalami kebinasaan karena kekurangan oksigen akibat dekomposisi alga."]], "q": "Kalimat yang menggunakan ejaan dengan benar terdapat pada nomor ....", "o": ["(1), (2), dan (3)", "(1), (3), dan (4)", "(2), (4), dan (6)", "(3), (4), dan (5)", "(4), (5), dan (6)"], "a": "B", "e": "Kalimat (2), (5), dan (6) salah karena memakai huruf kapital pada \"Perairan Laut\" dan \"Laut\" yang bukan nama diri geografi; seharusnya \"perairan laut\" dan \"laut\". Kalimat (1), (3), dan (4) benar; \"Teluk Meksiko\" adalah nama diri sehingga berhuruf kapital."}, {"n": 34, "g": null, "ps": [["h", "Cermati kedua kutipan cerpen berikut!"], ["l", "Kutipan 1"], ["p", "Nayla terkenang dengan segala petuah yang dulu orang tuanya katakan, Nayla tidak hiraukan. Segala logika yang tertanam di kepalanya, Nayla abaikan. Segala peristiwa di masa lalunya, Nayla singkirkan. Cincin emas putih bertatahkan permata yang sudah tersemat di jari manis tangan kanannya bagaikan jendela yang terkuak lebar menatap masa depan."], ["p", "\"Ngelamun aja kerjanya setiap hari. Ga ada gunanya sama sekali!\""], ["p", "Nayla terkejut dan tergagap. Ia segera mengikuti langkah suaminya yang bergegas menuju kamar."], ["s", "(Jemari Kiri, Djenar Maesa Ayu)"], ["l", "Kutipan 2"], ["p", "\"Mak hendak pulang, Nak. Sudah seminggu, nanti pisang Emak ditebang orang, karet pun sayang tak disadap.\" lontar Mak Inang di pagi yang tak bisa ia tahan lagi. Ia benar-benar tak ingin berlama-lama di ibu kota yang sungguh aneh baginya. Sesungguhnya, Mak Inang pun aneh dengan orang-orang yang saban hari, saban minggu, saban bulan, dan saban tahun datang mengadu nasib ke kota ini. Apa yang mereka cari di rimba bernyamuk ganas? Mak Inang tak bisa menghabiskan pikiran itu pada sebuah jawaban. Mak Inang ingin segera pulang."], ["s", "(Dua Wajah Ibu, Guntur Alam)"]], "q": "Perbedaan karakter tokoh pada kedua kutipan cerpen tersebut adalah ....", "o": ["<b>Kutipan 1:<\/b> berpandangan pesimis akan hari depan, ingatannya selalu kembali ke masa lalu<br><b>Kutipan 2:<\/b> tidak berpendirian tetap, ingin segera pulang kampung karena hasil buminya tidak ada yang mengurus", "<b>Kutipan 1:<\/b> memiliki optimisme akan hari depan bersama suaminya, tetapi masih ada bayang-bayang masa lalu yang tak bisa dilupakannya<br><b>Kutipan 2:<\/b> berpendirian teguh ingin kembali ke kampung halaman untuk mengurusi suami dan perkebunan yang dimilikinya", "<b>Kutipan 1:<\/b> memiliki tekad kuat membuang kenangan di masa lalu dan optimis akan hari depan bersama suami tercinta<br><b>Kutipan 2:<\/b> berpendirian teguh akan kembali ke kampung halaman karena pesimis melihat situasi kehidupan di ibu kota", "<b>Kutipan 1:<\/b> sentimental akan kenangan masa lalunya, tidak bisa melepas bayang-bayang masa lalu walaupun sudah hidup bahagia dengan suami tercinta<br><b>Kutipan 2:<\/b> bertekad meninggalkan anaknya di ibu kota demi kehidupan di kampung halaman yang lebih nyaman, tentram, dan membahagiakan", "<b>Kutipan 1:<\/b> keegoisan suami terhadap istrinya yang tidak mau tahu kondisi istrinya yang masih terkenang masa lalunya<br><b>Kutipan 2:<\/b> anak yang tidak peduli terhadap ibunya yang berniat pulang kampung karena tidak betah hidup di ibu kota"], "a": "C", "e": "Nayla (kutipan 1) mengabaikan petuah dan menyingkirkan peristiwa masa lalu, dan cincin di jarinya dilukiskan sebagai jendela yang terbuka lebar menatap masa depan: ia bertekad membuang masa lalu dan optimis. Mak Inang (kutipan 2) bersikeras ingin pulang karena merasa asing dan tidak betah dengan kehidupan ibu kota (pesimis terhadap situasi di sana). Hal ini sesuai pilihan C."}, {"n": 35, "g": [35, 36], "ps": [["h", "Cermati kutipan berikut untuk menjawab soal nomor 35 dan 36!"], ["p", "(1) Sudah tiga hari aku mogok bicara dan memeram diri. Semua ketukan pintu aku balas dengan kalimat pendek, \"Sedang tidur\". (2) Dalam hati aku berharap Amak berubah pikiran melihat kondisi anak bujangnya yang terus mengurung diri ini. (3) Amak memang berusaha menjinakkan perasaanku dengan mengajak bicara dari balik pintu. Suaranya cemas dan sedih. (4) Tapi, tiga hari berlalu, tidak ada tanda-tanda keinginan keras Amak goyah. (5) Tidak ada tawaran yang berbeda tentang sekolah, yang ada hanya imbauan untuk tidak mengunci diri."]], "q": "Pembuktian watak tokoh Amak yang kukuh pada pendiriannya terdapat pada kalimat bernomor ....", "o": ["(1)", "(2)", "(3)", "(4)", "(5)"], "a": "D", "e": "Kukuh pada pendirian berarti tidak berubah sikap meskipun ditekan. Kalimat (4) menyatakan bahwa setelah tiga hari tidak ada tanda keinginan keras Amak goyah. Itu bukti langsung keteguhan pendirian Amak."}, {"n": 36, "g": [35, 36], "ps": [["h", "Cermati kutipan berikut untuk menjawab soal nomor 35 dan 36!"], ["p", "(1) Sudah tiga hari aku mogok bicara dan memeram diri. Semua ketukan pintu aku balas dengan kalimat pendek, \"Sedang tidur\". (2) Dalam hati aku berharap Amak berubah pikiran melihat kondisi anak bujangnya yang terus mengurung diri ini. (3) Amak memang berusaha menjinakkan perasaanku dengan mengajak bicara dari balik pintu. Suaranya cemas dan sedih. (4) Tapi, tiga hari berlalu, tidak ada tanda-tanda keinginan keras Amak goyah. (5) Tidak ada tawaran yang berbeda tentang sekolah, yang ada hanya imbauan untuk tidak mengunci diri."]], "q": "Amanat yang terdapat dalam kutipan tersebut adalah ...", "o": ["Hargailah perhatian dan kasih orang tua terhadap kita.", "Janganlah bersikap keras kepala terhadap orang tua.", "Tetaplah pada pendirian kita sekalipun terhadap orang tua.", "Berpikirlah logis dalam memandang segala persoalan.", "Selesaikanlah segala perselisihan dengan lapang dada."], "a": "A", "e": "Meskipun tokoh aku mengurung diri dan mogok bicara, Amak tetap berusaha dengan sabar membujuk dari balik pintu dengan suara cemas dan sedih. Pesan yang dapat diambil: hargailah perhatian dan kasih sayang orang tua kepada kita."}, {"n": 37, "g": null, "ps": [["h", "Cermati kutipan teks drama berikut!"], ["p", "(Matahari panas menyengat. Di teras rumah, Wawan dan Wito saling berkeluh-kesah)"], ["p", "Wawan : \"Hidup rasanya kok makin susah.\""], ["p", "Wito : \"Sejak zaman Singosari sampai sekarang namanya rakyat selalu sengsara kok, Mas.\""], ["p", "Wawan : (menghela napas) \"Di sekolah, Anton tidak pakai seragam batik. Sementara teman lainnya punya seragam baru. Kalau beli, ya harus cari pinjaman. Satu-satunya hanya Joyo Logok si rentenir itu yang bisa memberi pinjaman.\""], ["p", "Wito : \"Mau bagaimana lagi, Mas. Aku juga tidak punya uang, istriku juga mau melahirkan.\""], ["p", "Wawan : \"Ya sudah, nanti sore saya ke rumah Joyo Logok.\""]], "q": "Paragraf narasi yang sesuai dengan isi teks drama tersebut adalah ...", "o": ["Matahari baru mulai menyinari bumi. Di seberang warung sebuah rumah, Wawan dan Wito berkeluh-kesah tentang kondisi hidup yang penuh utang. Anton, anak Wawan, belum mempunyai seragam batik. Teman-teman Anton sudah mempunyai seragam baru. Wawan tidak mempunyai uang. Wito juga tidak punya uang, padahal istrinya akan melahirkan. Wawan akhirnya harus meminjam uang pada rentenir yang bernama Joyo Logok.", "Panas matahari menyengat bumi. Di bawah sebuah pohon, Wawan dan Wito berkeluh-kesah tentang kondisi hidup yang kadang senang kadang susah. Anton, anak Wawan, belum mempunyai seragam batik. Teman-teman Anton sudah mempunyai seragam baru. Wawan tidak mempunyai uang. Wito juga tidak punya uang, padahal istrinya akan melahirkan. Wawan akhirnya harus meminjam uang pada rentenir yang bernama Joyo Logok.", "Panas matahari menyengat bumi. Di teras sebuah rumah, Wawan dan Wito berkeluh-kesah tentang kondisi hidup yang semakin susah. Anton, anak Wawan, belum mempunyai seragam batik, sementara teman-teman Anton sudah punya yang baru. Wawan tidak punya uang, sementara istrinya akan melahirkan. Wawan akhirnya akan meminjam uang pada rentenir yang bernama Joyo Logok.", "Matahari belum sepenggalah tingginya. Di sebuah dangau sawah, Anton dan Wito berkeluh-kesah tentang kondisi hidup yang terasa semakin susah. Wawan, anak Anton, belum mempunyai seragam batik. Teman-teman Anton sudah mempunyai seragam baru. Anton tidak mempunyai uang. Wito juga tidak punya uang, padahal istrinya akan melahirkan. Anton akhirnya harus meminjam uang pada rentenir yang bernama Joyo Logok.", "Sinar matahari belum menyengat bumi. Di sebuah teras rumah, Wito dan Wawan berkeluh-kesah tentang kondisi hidup yang terasa semakin susah. Wito, anak Wito, belum mempunyai seragam batik. Teman-teman Anton sudah mempunyai seragam baru. Wito tidak mempunyai uang. Wawan juga tidak punya uang, padahal istrinya akan melahirkan. Wito akhirnya harus meminjam uang pada rentenir yang bernama Joyo Logok."], "a": "C", "e": "Latar dalam drama: matahari panas menyengat, di teras rumah. Tokoh: Wawan dan Wito yang berkeluh-kesah karena hidup semakin susah. Anton adalah anak Wawan yang belum punya seragam batik; Wawan tidak punya uang; istri Wito akan melahirkan; Wawan akan meminjam uang pada Joyo Logok. Pilihan A, B, D, dan E memuat kesalahan latar (matahari baru terbit, warung, pohon, dangau) atau tokoh (hubungan Anton dan peminjam keliru). Catatan: pada pilihan C kalimat tentang istri \"akan melahirkan\" mengacu ke Wito dalam drama, tetapi pilihan ini tetap yang paling sesuai dibanding yang lain."}, {"n": 38, "g": null, "ps": [["h", "Cermati teks berikut!"], ["p", "(1) Produk-produk makanan yang disajikan dengan cara digoreng kini sudah menjadi industri besar sehingga siap saji. (2) Tidak ada hal yang buruk mengenai makanan siap saji itu bahwa dikonsumsi sewajarnya. (3) Bahan dasar kelompok santapan ini merupakan pangan bergizi karena berbahan daging ayam atau daging sapi yang disandingkan dengan kentang atau nasi. (4) Ketidakseimbangan gizi muncul karena di dalam porsi pangan hewani terkandung cukup banyak kolesterol. (5) Apalagi, kandungan nabati pada makanan siap saji ini umumnya rendah."]], "q": "Penggunaan konjungsi yang tidak tepat pada teks tersebut terdapat pada kalimat nomor ....", "o": ["(1) dan (2)", "(2) dan (3)", "(3) dan (4)", "(4) dan (5)", "(5) dan (1)"], "a": "A", "e": "(1) \"menjadi industri besar sehingga siap saji\": \"sehingga\" menyatakan akibat dan tidak cocok; seharusnya \"yang siap saji\" atau \"siap saji\" tanpa konjungsi. (2) \"... bahwa dikonsumsi sewajarnya\": \"bahwa\" tidak tepat; seharusnya konjungsi syarat seperti \"jika/asalkan\". Kalimat (3), (4), dan (5) menggunakan \"karena\" dan \"apalagi\" secara tepat."}, {"n": 39, "g": null, "ps": [["h", "Cermati kalimat-kalimat berikut!"], ["p", "(1) Jamal, membenarkan kasus pembunuhan di desa Sukamanah."], ["p", "(2) Museum Sejarah Purbakala dan Nilai Tradisi berada di sana."], ["p", "(3) Malik seorang perantau dari lareh nan panjang yang lebih dulu mengadu untung di Jakarta."], ["p", "(4) Letusan ini tidak seperti letusan tahun 1990 karena sumber energi magma tidak didominasi oleh gas."], ["p", "(5) Ia tinggal di Surabaya sejak tahun 2011."], ["p", "(6) Tahun 2017 yang lalu, ia mendapat gelar professor sebuah Universitas ternama."]], "q": "Penggunaan ejaan yang salah terdapat pada kalimat ....", "o": ["(1), (2), dan (3)", "(1), (3), dan (4)", "(1), (3), dan (6)", "(3), (4), dan (5)", "(3), (4), dan (6)"], "a": "C", "e": "Kalimat (1) salah: tidak boleh ada koma antara subjek dan predikat, serta \"desa Sukamanah\" seharusnya \"Desa Sukamanah\" bila nama diri. Kalimat (3) salah: \"lareh nan panjang\" (nama daerah/Lareh Nan Panjang) harus berhuruf kapital. Kalimat (6) salah: \"professor\" seharusnya \"profesor\" dan \"Universitas\" seharusnya \"universitas\" (bukan nama diri). Kalimat (2), (4), dan (5) benar."}, {"n": 40, "g": null, "ps": [["h", "Cermati paragraf berikut!"], ["p", "Tanah longsor terjadi bila gaya pendorong pada lereng lebih besar daripada gaya penahan. Gaya penahan umumnya dipengaruhi oleh kekuatan batuan dan kepadatan tanah. Akan tetapi gaya pendorong dipengaruhi oleh besarnya sudut kemiringan lereng, air, beban dan berat jenis tanah batuan. Lemahnya gaya penahan dan kuatnya gaya pendorong akan menimbulkan terjadinya tanah longsor. Ancaman tanah longsor biasanya terjadi pada musim penghujan karena intensitas curah hujan meningkat."]], "q": "Perbaikan penggunaan tanda baca pada kalimat dalam paragraf tersebut adalah ...", "o": ["Tanah longsor terjadi, bila gaya pendorong pada lereng lebih besar daripada gaya penahan.", "Gaya penahan umumnya, dipengaruhi oleh kekuatan batuan dan kepadatan tanah.", "Akan tetapi, gaya pendorong dipengaruhi oleh besarnya sudut kemiringan lereng, air, beban, dan berat jenis tanah batuan.", "Lemahnya gaya penahan, dan kuatnya gaya pendorong, akan menimbulkan terjadinya tanah longsor.", "Ancaman tanah longsor biasanya terjadi pada musim penghujan, karena intensitas curah hujan meningkat."], "a": "C", "e": "Kata penghubung antarkalimat \"Akan tetapi\" diikuti koma, dan pada perincian (air, beban, dan berat jenis) sebelum kata \"dan\" diberi tanda koma. Pilihan A, B, D, dan E salah karena membubuhkan koma yang tidak diperlukan (sebelum konjungsi subordinatif \"bila/karena\", antara subjek dan predikat, atau sebelum \"dan\" yang menghubungkan dua klausa/frasa sederhana)."}, {"n": 41, "g": null, "ps": [["h", "Cermati judul-judul karangan berikut!"], ["p", "(1) Meningkatkan Peran Pelajar dalam Pembangunan Karakter"], ["p", "(2) Upaya Pencegahan Penggunaan Narkoba pada Remaja"], ["p", "(3) Usaha Mengurangi Pencemaran Lingkungan di Sekolah"], ["p", "(4) Upaya meningkatkan Kesehatan Siswa dengan Senam Pagi"], ["p", "(5) DPR RI telah Mengesahkan Undang-undang Penyiaran"]], "q": "Penulisan judul karangan yang salah beserta alasannya terdapat pada ...", "o": ["Judul (1), huruf d pada awal kata dalam seharusnya ditulis huruf kapital karena merupakan kata tugas.", "Judul (2), huruf p pada awal kata pada seharusnya ditulis huruf kapital karena merupakan kata depan.", "Judul (3), huruf d pada kata di seharusnya ditulis huruf kapital karena merupakan kata depan.", "Judul (4), huruf d pada kata dengan seharusnya ditulis huruf kapital karena merupakan kata keterangan.", "Judul (5), kata Undang-undang seharusnya ditulis Undang-Undang karena perulangan kata dasar (kata ulang utuh) harus ditulis huruf kapital."], "a": "E", "e": "Dalam judul, setiap unsur kata ditulis dengan huruf awal kapital, kecuali partikel dan kata tugas (di, ke, dari, dalam, pada, dengan, dan, yang, untuk) yang tidak terletak di awal. Pada kata ulang dalam judul, kedua unsurnya berhuruf kapital, sehingga \"Undang-undang\" harus \"Undang-Undang\" (E). Catatan: judul (4) juga memuat kesalahan lain, yakni kata \"meningkatkan\" yang seharusnya \"Meningkatkan\", tetapi alasan yang tertulis pada pilihan D keliru sehingga pilihan D salah. Pilihan A, B, dan C keliru karena kata tugas/depan tidak dikapitalkan."}, {"n": 42, "g": null, "ps": [["h", "Cermati kutipan cerpen berikut!"], ["p", "Buat seorang janda yang sudah terlalu tua untuk itu, apalah yang dikehendaki lagi selain atap untuk berteduh dan makan serta pakaian yang cukup. Lagi pula anak tunggalnya yang tinggal di Surabaya dan menurut kabar, hidup berkecukupan, tidak mau lagi berhubungan dengannya. Tarikan dan pelukan istri dan anak-anaknya rupanya begitu erat melekat hingga mampu melupakan ibunya sama sekali. Tidak apa, hibumya. Di rumah keluarga Mulyono ini, dia merasa mendapat semuanya. Tetapi waktu dia mulai merasa semakin renta, tidak sekuat sebelumnya, Mbok Jah merasa dirinya menjadi beban keluarga itu. Dia merasa menjadi buruh tumpangan gratis. Dan harga dirinya memberontak terhadap keadaan itu. [....]"]], "q": "Kalimat prediksi kesedihan yang tepat untuk melengkapi cerpen tersebut adalah ...", "o": ["Mbok Jah berusaha mengenang masa-masa indah di masa lalu ketika anaknya masih kecil.", "Dengan berat hati, Mbok Jah lalu pulang ke kampungnya, walaupun akan menanggung kesepian di sana.", "Keluarga Mulyono menganggap Mbok Jah bukan orang lain lagi karena sudah puluhan tahun ia bersama mereka.", "Rumah keluarga Mulyono penuh kehangatan dibandingkan dengan keluarga di kampung yang hidup seadanya.", "Mulyono sudah dianggapnya seperti anak sendiri karena sebelum dia menikah pun Mbok Jah yang merawatnya."], "a": "B", "e": "Kalimat sebelum bagian rumpang menyatakan bahwa harga diri Mbok Jah memberontak karena merasa menjadi beban. Prediksi yang paling logis adalah ia memutuskan pergi/pulang ke kampung meskipun harus menanggung kesepian (B), karena ia tidak mau lagi menumpang. Pilihan lain tidak sejalan dengan perasaan memberontak itu."}, {"n": 43, "g": null, "ps": [["h", "Cermati kutipan novel berikut!"], ["p", "Filicium decipiens biasa ditanam botinikus untuk mengundang burung. Daunnya lebat tak kenal musim, bentuk daunnya cekung sehingga dapat menampung embun untuk barang-barang kecil minum. Dahannya pun mungil, menarik hari burung segala ukuran. Lebih dari itu, dalam jarak 50 meter dari pohon ini, di belakang sekolah kami, berdiri kekar menjulang awan sebatang pohon tua ganitri (Elaeocarpus sphaericus schum). Tingginya hampir 20 meter, dua kali lebih tinggi dari Filicium decipiens. Konfigurasi ini menguntungkan bagi burung-burung kecil cantik dan aduhai yang diciptakan untuk selalu menjaga jarak dengan manusia."]], "q": "Kelemahan kutipan novel tersebut adalah ...", "o": ["Penggunaan istilah bidang biologi yang memperkaya perbendaharaan kata pembaca.", "Penggunaan bahasa sehari-hari yang komunikatif terasa menghambarkan cerita.", "Penggambaran latar suasana yang sangat hidup, tetapi sudah nyata.", "Penggunaan istilah bidang biologi yang tidak umum sedikit menyulitkan bagi pembaca.", "Penggambaran tokoh secara langsung oleh pengarang merupakan hal biasa."], "a": "D", "e": "Kutipan banyak memakai nama ilmiah (Filicium decipiens, Elaeocarpus sphaericus schum) dan istilah biologi yang tidak lazim bagi pembaca umum. Hal ini menjadi kelemahan karena dapat menyulitkan pemahaman pembaca. Pilihan A adalah kelebihan, bukan kelemahan."}, {"n": 44, "g": null, "ps": [["h", "Cermati kedua teks berikut!"], ["l", "Teks 1"], ["p", "Bisa dibayangkan misalnya di sekitar Jalan Sudirman-Thamrin dibangun 200 rumah susun atau apartemen dengan berbagai macam kelas dan ukuran untuk menjangkau berbagai level strata sosial ekonomi di masyarakat. Misalnya, tiap unit terdiri atas 25 lantai dan tiap lantai ada 20 unit, akan ada 500 unit tiap tower. Dengan asumsi tiap unit terdiri atas satu keluarga dengan jumlah tiga orang, akan ada 1.500 penghuni tiap tower. Artinya, akan ada 300 ribu penduduk yang tinggal di sekitar Jalan Sudirman-Thamrin yang merupakan satu di antara pusat bisnis di Jakarta. Jika sebagian besarnya akhirnya berpindah ke transportasi publik, sudah bisa dipastikan kemacetan akan berkurang. Itu baru hanya untuk wilayah Sudirman-Thamrin. Apabila kebijakan yang sama diterapkan di wilayah-wilayah lain di Jakarta, maka akan lebih banyak kemacetan yang tereduksi."], ["l", "Teks 2"], ["p", "Pembangunan rumah susun menjadi solusi bagi penyediaan rumah di kota-kota besar. Rusun atau apartemen dapat menghemat luas tanah permukiman, selain itu juga dapat menampung jauh lebih banyak orang dalam satu areal. Belum lagi dengan aneka fasilitas yang disediakan pengelola akan memudahkan orang yang tinggal di sana. Memang sebagian masyarakat Indonesia belum terbiasa tinggal di rusun. Mereka menganggap rusun atau apartemen bukan tempat ideal untuk ditinggali. Namun, ketiadaan tanah permukiman dan tingginya biaya pembangunan rumah menjadi alasan penting pembangunan rumah susun di wilayah perkotaan."]], "q": "Kesimpulan terhadap isi kedua teks tersebut adalah ...", "o": ["Pembangunan rumah susun atau apartemen belum menjadi budaya masyarakat Indonesia yang memiliki budaya komunal dengan kebiasaan bergotong royong dan kebersamaan.", "Memang sebagian masyarakat Indonesia belum terbiasa tinggal di rusun dan menganggap rusun atau apartemen bukan tempat ideal untuk ditinggali dalam kehidupan sehari-hari.", "Pembangunan rumah susun dengan berbagai kelas dan ukuran yang menjangkau berbagai level strata sosial ekonomi dapat menghemat luas tanah permukiman dan mengatasi masalah kemacetan.", "Jalan Sudirman-Thamrin yang merupakan satu di antara pusat bisnis di Jakarta menjadi sentra perdagangan dan ekonomi membutuhkan lahan perkantoran dan permukiman yang memadai.", "Tumbuhnya masyarakat kelas atas yang semakin banyak mengubah perilaku dan kebutuhan pola tinggal sehingga diperlukan pembangunan rumah susun atau apartemen di pusat-pusat ekonomi."], "a": "C", "e": "Teks 1 menyoroti manfaat rusun/apartemen (dibangun untuk berbagai strata sosial, mengurangi kemacetan). Teks 2 menyoroti manfaat rusun (menghemat lahan, menampung lebih banyak orang). Kesimpulan gabungan yang paling tepat adalah rusun dengan berbagai kelas dapat menghemat lahan permukiman dan mengatasi kemacetan (C)."}, {"n": 45, "g": null, "ps": [["h", "Cermati kutipan teks sejarah berikut!"], ["p", "Huruf Braille adalah huruf yang dibuat khusus untuk para tunanetra. Huruf ini diciptakan oleh Louis Braille. Sebelumnya pada tahun 1816, Charles Barbier, seorang anggota militer Prancis, menemukan suatu metode menulis dengan menggunakan titik dan tanda garis. Braille menganalisis kekurangan dari metode ciptaan Charles Barbier tersebut. Louis Braille memperbaiki sistem ini dan menulis buku berkenaan dengan sistem Braille pada 1829 dan 1837. Meskipun pada permulaannya terdapat halangan dari mereka yang tidak memahami keperluan tunanetra, Louis Braille senantiasa gigih menyebarkan tulisan ciptaannya. Kegigihan Braille kian bertambah saat ia menjadi guru hingga huruf-huruf ciptaan Braille diterima khalayak ramai yang akhirnya ribuan penyandang tunanetra dapat membaca. Louis Braille kemudian meninggal dunia tahun pada 1852 dalam usia 41 tahun."]], "q": "Alasan Louis Braille mengembangkan penemuan huruf Braille adalah ...", "o": ["Huruf Braille yang ditemukan sebelumnya oleh Charles Barbier sudah bagus tetapi sulit dipelajari.", "Huruf Braille membantu penyandang tunanetra untuk memahami berbagai informasi berdasarkan narasumber.", "Huruf Braille membantu penyandang tunanetra untuk dapat membaca sehingga tidak ketinggalan informasi.", "Huruf Braille yang sudah ditemukan sebelumnya belum memuat tanda baca.", "Metode menulis untuk penyandang tunanetra yang ditemukan sebelumnya hanya berlaku di kalangan terbatas."], "a": "C", "e": "Teks menyatakan bahwa Braille gigih menyebarkan hasil ciptaannya sampai ribuan penyandang tunanetra dapat membaca. Alasan pengembangannya adalah agar penyandang tunanetra dapat membaca dan tidak ketinggalan informasi (C). Pilihan A, D, dan E memuat alasan yang tidak disebut dalam teks."}, {"n": 46, "g": null, "ps": [["h", "Cermati kutipan teks berikut!"], ["p", "Sampah merupakan material sisa yang tidak digunakan lagi setelah mengalami suatu proses. Sampah dapat bersumber dari alam, manusia, industri, dan pertambangan. Sampah di bumi akan terus bertambah selama masih ada kegiatan yang dilakukan, baik oleh alam maupun manusia. Sampah yang dihasilkan di Indonesia mencapai 11 ton per harinya. Berikut dampak yang ditimbulkan oleh berbagai sumber sampah terhadap masyarakat."], ["html", "<table class=\"mini\"><tr><th>No.<\/th><th>Bahan Pencemar<\/th><th>Sumber<\/th><th>Dampak pada Individu/Masyarakat<\/th><\/tr><tr><td>1.<\/td><td>Sulfur Dioksida (SO₂)<\/td><td>batubara/bahan bakar minyak yang mengandung sulfur, pembakaran limbah pertanahan, proses dalam industri<\/td><td>menimbulkan efek iritasi pada saluran napas sehingga menimbulkan gejala batuk dan sesak napas<\/td><\/tr><tr><td>2.<\/td><td>Hidrogen Sulfa (H₂S)<\/td><td>dari kawah gunung yang masih aktif<\/td><td>menimbulkan bau yang tidak sedap dan dapat merusak indera penciuman (nervus olfactory)<\/td><\/tr><tr><td>3.<\/td><td>Nitrogen Oksida (N₂O), Nitrogen Monoksida (NO), Nitrogen Dioksida (NO₂)<\/td><td>berbagai jenis pembakaran gas buang, kendaraan bermotor, peledak, pabrik pupuk<\/td><td>mengganggu sistem pernapasan dan melemahkan sistem pernapasan, serta saluran napas sehingga paru-paru mudah terserang infeksi<\/td><\/tr><tr><td>4.<\/td><td>Amoniak (NH₃)<\/td><td>proses industri<\/td><td>menimbulkan bau yang tidak sedap/menyengat, menyebabkan sistem pernapasan bronkitis, dan merusak indera penciuman<\/td><\/tr><\/table>"]], "q": "Alternatif pemecahan masalah yang sesuai dengan isi teks tersebut adalah ...", "o": ["Pemerintah hendaknya membuat peraturan tentang pengelolaan sampah dan penegakan hukum yang tegas bagi pelanggarnya.", "Masyarakat yang berada di sekitar pembuangan sampah perlu mengecek kondisi kesehatannya secara berkala.", "Hindari tempat-tempat sampah karena merupakan sumber segala penyakit yang mengakibatkan gangguan kesehatan.", "Para pengelola sampah hendaknya dapat menciptakan teknologi pembuangan yang efektif dan efisien.", "Pengembangan dan penerapan teknologi pada pengelolaan sampah harus dapat diterapkan di segala lini."], "a": "A", "e": "Teks menjelaskan sumber dan dampak sampah/pencemar (industri, kendaraan, pembakaran). Pemecahan masalah yang paling sesuai dan menyentuh akar persoalan adalah penetapan peraturan pengelolaan sampah beserta penegakan hukum bagi pelanggar (A). Pilihan B bersifat reaktif, C berlebihan (\"sumber segala penyakit\"), dan D serta E terlalu umum atau tidak ditunjang isi teks."}, {"n": 47, "g": [47, 49], "ps": [["h", "Cermati teks berikut untuk menjawab soal nomor 47 s.d. 49!"], ["l", "Teks 1"], ["p", "Pewarna tekstil banyak digunakan dalam usaha kuliner untuk memberikan warna pada produk makanan. Contohnya adalah metanil yellow yang digunakan pada jelly, agar-agar, tahu, kerupuk, dan lain-lain. Harga metanil yellow lebih murah dibandingkan pewarna kuning FCF yang telah mendapat izin Depkes RI. Penggunaan zat metanil yellow juga lebih mudah daripada menggunakan pewarna alami dari tumbuh-tumbuhan. Tampilan jelly dan agar-agar yang diberi metanil yellow lebih menarik, yakni warna lebih tajam dan lebih mengilat. Konsumen, terutama anak-anak, lebih memilih jelly dan agar-agar yang berwarna mencolok. Dengan begitu, pengusaha kuliner yang menggunakan metanil yellow dapat meraup banyak keuntungan daripada yang menggunakan pewarna makanan berizin dan yang masih bertahan menggunakan pewarna alami."], ["l", "Teks 2"], ["p", "Metanil yellow merupakan zat warna sintetis yang digunakan untuk memberi warna kuning pada industri tekstil, kertas, tinta, plastik, kulit, dan cat. Zat yang juga dikenal dengan nama acid yellow 36 ini berbentuk serbuk berwarna oranye. Metanil yellow sering disalahgunakan untuk mewarnai berbagai jenis makanan seperti kerupuk, mie, tahu, dan makanan jajanan yang berwarna kuning. Menurut Peraturan Menteri Kesehatan Republik Indonesia Nomor 239/Men.Kes/Per/V/85, metanil yellow merupakan zat warna tambahan yang dilarang penggunaannya dalam produk-produk pangan. Bahaya kronis dari penggunaan metanil yellow dalam jangka panjang menyebabkan gangguan kesehatan pada fungsi hati, gangguan kandung kemih, bahkan kanker."]], "q": "Tujuan penulis sesuai teks 1 adalah ...", "o": ["Menginformasikan pada pembaca perihal daya tarik dalam produk makanan.", "Memaparkan adanya penggunaan metanil yellow pada berbagai usaha kuliner.", "Mengajak pembaca untuk membandingkan bahan pewarna tekstil dan alami.", "Menginformasikan manfaat metanil yellow untuk kesehatan tubuh manusia.", "Menjelaskan definisi metanil yellow dan mendeskripsikan bentuk dan warnanya."], "a": "B", "e": "Teks 1 menguraikan penggunaan pewarna tekstil metanil yellow pada makanan seperti jelly, agar-agar, tahu, dan kerupuk di berbagai usaha kuliner, beserta alasan pengusaha memakainya (murah, mudah, menarik). Jadi tujuan penulis adalah memaparkan adanya penggunaan metanil yellow dalam usaha kuliner. Definisi dan bentuk metanil yellow justru ada pada teks 2."}, {"n": 48, "g": [47, 49], "ps": [["h", "Cermati teks berikut untuk menjawab soal nomor 47 s.d. 49!"], ["l", "Teks 1"], ["p", "Pewarna tekstil banyak digunakan dalam usaha kuliner untuk memberikan warna pada produk makanan. Contohnya adalah metanil yellow yang digunakan pada jelly, agar-agar, tahu, kerupuk, dan lain-lain. Harga metanil yellow lebih murah dibandingkan pewarna kuning FCF yang telah mendapat izin Depkes RI. Penggunaan zat metanil yellow juga lebih mudah daripada menggunakan pewarna alami dari tumbuh-tumbuhan. Tampilan jelly dan agar-agar yang diberi metanil yellow lebih menarik, yakni warna lebih tajam dan lebih mengilat. Konsumen, terutama anak-anak, lebih memilih jelly dan agar-agar yang berwarna mencolok. Dengan begitu, pengusaha kuliner yang menggunakan metanil yellow dapat meraup banyak keuntungan daripada yang menggunakan pewarna makanan berizin dan yang masih bertahan menggunakan pewarna alami."], ["l", "Teks 2"], ["p", "Metanil yellow merupakan zat warna sintetis yang digunakan untuk memberi warna kuning pada industri tekstil, kertas, tinta, plastik, kulit, dan cat. Zat yang juga dikenal dengan nama acid yellow 36 ini berbentuk serbuk berwarna oranye. Metanil yellow sering disalahgunakan untuk mewarnai berbagai jenis makanan seperti kerupuk, mie, tahu, dan makanan jajanan yang berwarna kuning. Menurut Peraturan Menteri Kesehatan Republik Indonesia Nomor 239/Men.Kes/Per/V/85, metanil yellow merupakan zat warna tambahan yang dilarang penggunaannya dalam produk-produk pangan. Bahaya kronis dari penggunaan metanil yellow dalam jangka panjang menyebabkan gangguan kesehatan pada fungsi hati, gangguan kandung kemih, bahkan kanker."]], "q": "Pernyataan yang tepat sesuai isi kedua teks tersebut berkaitan dengan metanil yellow adalah ...", "o": ["Masyarakat tetap menggunakan metanil yellow untuk makanan meski sudah dilarang pemerintah karena menyebabkan gangguan kesehatan.", "Pewarna tekstil yang bernama metanil yellow berbentuk serbuk berwarna oranye banyak digunakan dalam usaha kuliner.", "Menteri kesehatan melarang penggunaan metanil yellow karena dapat menyebabkan gangguan kesehatan pada ginjal dan hati.", "Pengusaha kuliner dapat meraup keuntungan dengan menggunakan pewarna tekstil metanil yellow untuk mewarnai berbagai jenis makanan const TOTAL=Q.length, DURATION=120*60;

function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function passageHTML(q){
  const html=q.ps.map(([t,v])=>{
    if(t==='h')return `<p class="ins">${v}</p>`;
    if(t==='l')return `<p class="lab">${v}</p>`;
    if(t==='s')return `<p class="src">${v}</p>`;
    if(t==='html')return `<div class="scroll">${v}</div>`;
    return `<p>${v}</p>`;
  }).join('');
  return html;
}
const L='ABCDE';
function status(i){return S.doubt[i]?'d':(S.answers[i]!=null?'a':'')}
function counts(){let a=0,d=0;for(let i=0;i<TOTAL;i++){if(S.doubt[i])d++;else if(S.answers[i]!=null)a++}return{a,d,u:TOTAL-a-d,ans:Object.keys(S.answers).length}}

function viewExam(){
  const st=S.student;
  app.innerHTML=`
  <div class="top">
    <div class="who"><b>${esc(st.nama)}</b><span>${esc(st.kelas)} · ${esc(st.sekolah)} · No. ${esc(st.nopd)}</span></div>
    <div class="timer" id="timer"><span>⏱</span><span id="tm">--:--:--</span></div>

  <div class="exam">

    </aside>

  document.getElementById('fin').onclick=confirmFinish;

function renderQ(){
  const i=S.cur,q=Q[i],sel=S.answers[i],d=S.doubt[i];
  const stt=d?'<span class="qstat d">Ragu-ragu</span>':sel!=null?'<span class="qstat a">Sudah dijawab</span>':'<span class="qstat">Belum dijawab</span>';
  const qc=document.getElementById('qc');
  qc.innerHTML=`
    <div class="qhead"><span class="qno">Soal ${q.n} / ${TOTAL}</span>${stt}</div>
    ${q.ps.length?`<div class="passage">${passageHTML(q)}</div>`:''}
    <p class="qtext">${q.q}</p>
    <div class="opts" role="radiogroup" aria-label="Pilihan jawaban">${q.o.map((o,k)=>`
      <button class="opt ${sel===k?'sel':''}" role="radio" aria-checked="${sel===k}" data-k="${k}"><span class="L">${L[k]}</span><span class="T">${o}</span></button>`).join('')}</div>
    <div class="nav">
      <button class="btn btn-ghost" id="prev" ${i===0?'disabled':''}>← Sebelumnya</button>
      <button class="btn btn-warn ${d?'on':''}" id="dbt">${d?'✓ Ragu-ragu':'Ragu-ragu'}</button>
      <span class="sp"></span>
      ${i===TOTAL-1?'<button class="btn btn-ok" id="next">Selesai ✓</button>':'<button class="btn btn-primary" id="next">Selanjutnya →</button>'}
    </div>`;
  qc.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k; if(S.answers[i]===k)delete S.answers[i]; else S.answers[i]=k; save();renderQ();
  });
  document.getElementById('prev').onclick=()=>go(i-1);
  document.getElementById('dbt').onclick=()=>{S.doubt[i]?delete S.doubt[i]:S.doubt[i]=true;save();renderQ()};
  document.getElementById('next').onclick=()=>i===TOTAL-1?confirmFinish():go(i+1);
  renderNav();
}
function go(i){S.cur=Math.max(0,Math.min(TOTAL-1,i));save();renderQ();
  const p=document.getElementById('qc');window.scrollTo({top:Math.max(0,p.getBoundingClientRect().top+scrollY-90),behavior:'smooth'})}
function renderNav(){
  const g=document.getElementById('grid');
  g.innerHTML=Q.map((q,i)=>`<button class="n ${status(i)} ${i===S.cur?'cur':''}" data-i="${i}" aria-label="Soal ${q.n}">${q.n}</button>`).join('');
  g.querySelectorAll('.n').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const c=counts();
  document.getElementById('pg').style.width=(c.ans/TOTAL*100)+'%';
  document.getElementById('lg').innerHTML=`<div><i class="a"></i>Sudah dijawab (${c.a})</div><div><i class="d"></i>Ragu-ragu (${c.d})</div><div><i></i>Belum dijawab (${c.u})</div>`;
}
function runTimer(){
  clearInterval(tick);
  const upd=()=>{
    const left=Math.round((S.endAt-Date.now())/1000);
    const tm=document.getElementById('tm'); if(tm){tm.textContent=fmt(left);document.getElementById('timer').classList.toggle('low',left<=600)}
    if(left<=0){clearInterval(tick);finish(true)}
  };
  upd();tick=setInterval(upd,1000);
}
function confirmFinish(){
  const c=counts();
  const r=document.getElementById('modalRoot');
  r.innerHTML=`<div class="modal"><div class="box" role="dialog" aria-modal="true">
    <h3>Kirim jawaban sekarang?</h3>
    <p style="margin:0;color:var(--muted)">Setelah dikirim, jawaban tidak dapat diubah.</p>
    <ul><li>Sudah dijawab: <b>${c.ans}</b> soal</li><li>Ragu-ragu: <b>${c.d}</b> soal</li><li>Belum dijawab: <b>${TOTAL-c.ans}</b> soal</li></ul>
    <div class="acts"><button class="btn btn-ghost" id="no">Kembali</button><button class="btn btn-primary" id="yes">Ya, Kirim</button></div></div></div>`;
  document.getElementById('no').onclick=()=>r.innerHTML='';
  document.getElementById('yes').onclick=()=>{r.innerHTML='';finish(false)};
  document.getElementById('yes').focus();
}
function finish(auto){
  clearInterval(tick);
  S.done=true;S.finishedAt=Math.min(Date.now(),S.endAt);save();
  document.getElementById('modalRoot').innerHTML='';
  filter='all';viewResult();window.scrollTo({top:0});
}
function viewResult(){
  const st=S.student;let ok=0,bad=0,emp=0;
  Q.forEach((q,i)=>{const a=S.answers[i];if(a==null)emp++;else if(L[a]===q.a)ok++;else bad++});
  const score=Math.round(ok/TOTAL*1000)/10;
  const used=Math.round((S.finishedAt-(S.endAt-DURATION*1000))/1000);
  const verdict=score>=85?'Sangat Baik':score>=70?'Baik':score>=55?'Cukup':'Perlu Belajar Lagi';
  const R=70,C=2*Math.PI*R;
  app.innerHTML=`
  <div class="card res">
    <div class="reshero">
      <div class="ring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="${R}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="14"/><circle cx="85" cy="85" r="${R}" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-score/100)}"/></svg>
        <div class="v"><b>${score%1?score.toFixed(1):score}</b><span>Nilai Akhir</span></div></div>
      <div class="ident"><h2>${esc(st.nama)}</h2>
        <dl><dt>Kelas</dt><dd>${esc(st.kelas)}</dd><dt>Asal Sekolah</dt><dd>${esc(st.sekolah)}</dd><dt>No. Peserta Didik</dt><dd>${esc(st.nopd)}</dd><dt>Mata Uji</dt><dd>Bahasa Indonesia SMA/MA IPS</dd></dl>
        <span class="verdict">${verdict}</span></div>
    </div>
    <div class="stats">
      <div class="stat ok"><b>${ok}</b><span>Jawaban benar</span></div>
      <div class="stat bad"><b>${bad}</b><span>Jawaban salah</span></div>
      <div class="stat em"><b>${emp}</b><span>Tidak dijawab</span></div>
      <div class="stat tm"><b>${Math.floor(used/60)}m ${used%60}s</b><span>Waktu pengerjaan</span></div>
    </div>
  </div>
  <div class="rev-h"><h2 style="font-size:22px">Pembahasan Soal</h2>
    <div class="chips" id="chips">${[['all','Semua ('+TOTAL+')'],['bad','Salah ('+bad+')'],['em','Kosong ('+emp+')'],['ok','Benar ('+ok+')']].map(([k,t])=>`<button class="chip ${filter===k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div></div>
  <div id="revs"></div>
  <div class="foot"><button class="btn btn-primary" id="again">Ulangi Try Out</button></div>`;
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));renderRev()});

}
function renderRev(){
  const out=Q.map((q,i)=>{
    const a=S.answers[i];const k=a==null?'em':L[a]===q.a?'ok':'bad';
    if(filter!=='all'&&filter!==k)return '';
    const lab={ok:'Benar',bad:'Salah',em:'Tidak dijawab'}[k];
    return `<article class="card rev">
      <div class="qhead"><span class="qno ${k}">Soal ${q.n}</span><span class="qstat ${k==='ok'?'a':k==='bad'?'':'' }" style="${k==='bad'?'background:var(--bad-soft);color:var(--bad)':''}">${lab}</span></div>
      ${q.ps.length?`<details><summary>Lihat teks / stimulus soal</summary><div class="passage">${passageHTML(q)}</div></details>`:''}
      <p class="qtext">${q.q}</p>
      ${q.o.map((o,j)=>{const right=L[j]===q.a,mine=a===j;
        return `<div class="ropt ${right?'right':mine?'wrong':''}"><span class="L">${L[j]}</span><span class="T">${o}</span>${right?`<span class="tg" style="color:var(--ok)">${mine?'JAWABANMU ✓':'KUNCI'}</span>`:mine?'<span class="tg" style="color:var(--bad)">JAWABANMU</span>':''}</div>`}).join('')}
      <div class="exp"><b>Pembahasan · Kunci ${q.a}</b><p>${q.e}</p></div>
    </article>`}).join('');
  document.getElementById('revs').innerHTML=out||'<div class="card rev" style="text-align:center">Tidak ada soal pada kategori ini.</div>';
}

(function init(){
  const s=load();
  if(s&&s.student){S=s; if(S.done)viewResult(); else if(Date.now()>=S.endAt){S.done=true;S.finishedAt=S.endAt;save();viewResult()} else viewExam()}
  else viewStart();
})();
</script>
