<style>
/* Layout: layar mulai berformat kartu ganda (hero warna + formulir); layar soal dua kolom (soal | navigasi nomor); hasil berupa kartu nilai + ulasan. */
:root{
  --bg:#f3f1ff; --surface:#ffffff; --fg:#1e1b3a; --muted:#6a6788; --line:#e0dcf5;
  --primary:#5b3df5; --primary-2:#00b8d9; --primary-ink:#ffffff; --soft:#ece8ff;
  --ok:#12a66a; --ok-soft:#d9f5e8; --warn:#f5a000; --warn-soft:#fff0cc; --bad:#e5383b; --bad-soft:#ffe1e2;
  --hero1:#5b3df5; --hero2:#00b8d9; --shadow:0 8px 30px rgba(60,40,160,.12);
  --f-head:'Sora','Plus Jakarta Sans',system-ui,sans-serif; --f-body:'Plus Jakarta Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12102a; --surface:#1d1a3d; --fg:#eeecff; --muted:#a29fc6; --line:#34305f; --soft:#2a2660;
  --primary:#8b78ff; --primary-ink:#12102a; --primary-2:#2fd0ee;
  --ok:#3ddc97; --ok-soft:#133a2d; --warn:#ffbf3d; --warn-soft:#41330f; --bad:#ff6b6e; --bad-soft:#42171a;
  --hero1:#4a30d8; --hero2:#0792ad; --shadow:0 8px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12102a; --surface:#1d1a3d; --fg:#eeecff; --muted:#a29fc6; --line:#34305f; --soft:#2a2660;
  --primary:#8b78ff; --primary-ink:#12102a; --primary-2:#2fd0ee;
  --ok:#3ddc97; --ok-soft:#133a2d; --warn:#ffbf3d; --warn-soft:#41330f; --bad:#ff6b6e; --bad-soft:#42171a;
  --hero1:#4a30d8; --hero2:#0792ad; --shadow:0 8px 30px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--primary-2);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-ghost{background:var(--soft);color:var(--primary)}
.btn-warn{background:var(--warn-soft);color:var(--fg);box-shadow:inset 0 0 0 2px var(--warn)}
.btn-warn.on{background:var(--warn);color:#2b1d00}
.btn-ok{background:var(--ok);color:#04251a}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}

/* start */
.start{display:grid;grid-template-columns:1.05fr 1fr;gap:0;overflow:hidden;margin-top:4vh}
.hero{background:linear-gradient(145deg,var(--hero1),var(--hero2));color:#fff;padding:40px;display:flex;flex-direction:column;gap:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;bottom:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{content:"";position:absolute;right:60px;bottom:120px;width:90px;height:90px;border-radius:50%;background:rgba(255,200,60,.55)}
.tag{align-self:flex-start;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-size:clamp(28px,4vw,40px);font-weight:800}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto;position:relative;z-index:1}
.fact{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px}
.fact b{display:block;font:800 22px var(--f-head)} .fact span{font-size:12px;opacity:.9}
.rules{margin:0;padding-left:18px;font-size:14px;opacity:.95;position:relative;z-index:1}
.form{padding:36px;display:flex;flex-direction:column;gap:14px}
.form h2{font-size:22px}
label{font-weight:600;font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input,select{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
input:focus,select:focus{border-color:var(--primary);outline:none}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* exam */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px;background:linear-gradient(100deg,var(--hero1),var(--hero2));color:#fff;border-radius:16px;box-shadow:var(--shadow)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.who{min-width:0} .who b{display:block;font:700 15px var(--f-head);overflow-wrap:anywhere} .who span{font-size:12px;opacity:.92}
.timer{background:rgba(255,255,255,.2);padding:8px 16px;border-radius:99px;font:800 20px var(--f-head);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.timer.low{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.qcard{padding:24px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.qno{background:var(--primary);color:var(--primary-ink);font:800 14px var(--f-head);padding:6px 14px;border-radius:99px}
.qstat{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.qstat.a{background:var(--ok-soft);color:var(--ok)} .qstat.d{background:var(--warn-soft);color:var(--warn)}
.passage{background:var(--bg);border-radius:14px;padding:14px 16px;margin-bottom:16px;border:1px solid var(--line);max-height:340px;overflow:auto}
.passage p{margin:0 0 .7em;overflow-wrap:anywhere} .passage p:last-child{margin:0}
.passage .ins{font-weight:700;color:var(--primary);font-size:13px;margin:0 0 .6em}
.passage .lab{font:700 13px var(--f-head);margin:.6em 0 .3em}
.passage .src{text-align:right;font-style:italic;color:var(--muted);font-size:13px}
.passage .scroll{overflow-x:auto}
em.hl{background:var(--warn-soft);font-style:italic;padding:0 3px;border-radius:4px}
table.mini{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.mini th{background:var(--soft)}
.qtext{font-weight:600;font-size:16.5px;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:11px 14px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--primary)}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--primary);font:800 13px var(--f-head)}
.opt .T{min-width:0;overflow-wrap:anywhere;padding-top:3px}
.opt.sel{border-color:var(--primary);background:var(--soft)} .opt.sel .L{background:var(--primary);color:var(--primary-ink)}
.nav{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.nav .sp{flex:1}
.side{padding:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px)}
.side h3{font-size:15px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.n{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:700 14px var(--f-head);display:grid;place-items:center;padding:0}
.n.a{background:var(--ok);border-color:var(--ok);color:#04251a}
.n.d{background:var(--warn);border-color:var(--warn);color:#2b1d00}
.n.cur{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--primary);transform:scale(1.04)}
.legend{display:grid;gap:6px;margin:14px 0;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px;margin-right:8px;vertical-align:-2px;border:2px solid var(--line);background:var(--surface)}
.legend i.a{background:var(--ok);border-color:var(--ok)} .legend i.d{background:var(--warn);border-color:var(--warn)}
.prog{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:14px}
.prog div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));width:0;transition:width .3s}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,10,50,.6);display:grid;place-items:center;padding:16px;z-index:30}
.modal .box{background:var(--surface);border-radius:20px;padding:26px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin-bottom:10px} .modal ul{margin:10px 0 18px;padding-left:18px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* result */
.res{overflow:hidden}
.reshero{background:linear-gradient(145deg,var(--hero1),var(--hero2));color:#fff;padding:32px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .v b{font:800 44px var(--f-head);line-height:1} .ring .v span{font-size:12px;opacity:.9}
.ident h2{font-size:26px;overflow-wrap:anywhere}
.ident dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-size:14px}
.ident dt{opacity:.8} .ident dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.verdict{display:inline-block;margin-top:12px;background:rgba(255,255,255,.22);padding:4px 14px;border-radius:99px;font-weight:700;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px}
.stat{border-radius:14px;padding:12px 14px} .stat b{display:block;font:800 26px var(--f-head)} .stat span{font-size:13px}
.stat.ok{background:var(--ok-soft);color:var(--ok)} .stat.bad{background:var(--bad-soft);color:var(--bad)}
.stat.em{background:var(--soft);color:var(--muted)} .stat.tm{background:var(--warn-soft);color:var(--warn)}
.rev-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.rev{padding:20px;margin-bottom:14px}
.rev .qhead .qno.ok{background:var(--ok);color:#04251a} .rev .qhead .qno.bad{background:var(--bad);color:#fff} .rev .qhead .qno.em{background:var(--muted);color:var(--surface)}
.rev details{margin-bottom:12px}
.rev summary{cursor:pointer;font-weight:700;color:var(--primary);font-size:13px;margin-bottom:8px}
.ropt{display:flex;gap:10px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);margin-bottom:8px;align-items:flex-start}
.ropt .L{flex:none;font:800 13px var(--f-head);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--primary)}
.ropt .T{min-width:0;overflow-wrap:anywhere}
.ropt.right{border-color:var(--ok);background:var(--ok-soft)} .ropt.right .L{background:var(--ok);color:#04251a}
.ropt.wrong{border-color:var(--bad);background:var(--bad-soft)} .ropt.wrong .L{background:var(--bad);color:#fff}
.ropt .tg{margin-left:auto;flex:none;font-size:11px;font-weight:800;padding-top:3px}
.exp{background:var(--soft);border-radius:14px;padding:14px 16px;margin-top:12px}
.exp b{font-family:var(--f-head);color:var(--primary);display:block;margin-bottom:4px}
.exp p{margin:0;overflow-wrap:anywhere}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:24px}

@media(max-width:860px){
  .start{grid-template-columns:1fr} .hero{padding:28px}
  .exam{grid-template-columns:1fr} .side{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .reshero{grid-template-columns:1fr;justify-items:center;text-align:center} .ident dl{text-align:left}

@media(max-width:480px){
  .grid{grid-template-columns:repeat(5,1fr)} .form{padding:22px} .qcard{padding:16px}
  .row2{grid-template-columns:1fr} .facts{grid-template-columns:1fr 1fr 1fr}
  .nav .btn{flex:1}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
